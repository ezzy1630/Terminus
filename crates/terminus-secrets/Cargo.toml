[package]
name = "terminus-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Secret broker with redaction and audit logging."

[lints]
workspace = true

[dependencies]
terminus-kernel-protocol = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
keyring = { workspace = true }
# Used for `spawn_blocking` + `time::timeout` only: the broker moves a
# blocking credential resolve onto the blocking pool under a deadline so an
# OS keychain prompt cannot park a tokio worker (see
# `SECRET_RESOLVE_TIMEOUT`).
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
