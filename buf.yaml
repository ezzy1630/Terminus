# Buf configuration for Protobuf schema governance (SPEC §45.4).
# The .proto files are the source of truth for the kernel RPC protocol.

version: v2

modules:
  - path: proto

lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
    # The kernel contract intentionally reuses shared request/response types
    # and its enum names are part of the existing wire contract.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - ENUM_ZERO_VALUE_SUFFIX
    - ENUM_VALUE_PREFIX

breaking:
  use:
    - WIRE_JSON
  ignore: []
