# Component maturity registry (roadmap Phase 0: truth, reproducibility, freeze).
#
# Machine-readable source of truth for the maturity of every code component
# in this repository. Consumed by:
#   - tools/codegen/maturity.ts   (coverage validation + docs/generated/component-maturity.md)
#   - scripts/check-declaration-consistency.ts (truth-check gate)
#   - scripts/produce-release-decision.ts (limitations + platform support)
#   - scripts/produce-system-card.ts (system card)
#
# Tiers (strictly ordered; a claim may never exceed its evidence):
#   fixture       test double or benchmark corpus; never production-capable
#   stub          declared contract only; implementation incomplete or no-op;
#                 must never be discoverable as production-capable
#   experimental  working implementation; conformance unproven; may change
#                 without notice
#   preview       working implementation with direct test coverage on a
#                 load-bearing surface; not yet conformance-proven at HEAD
#   production    conformance-tested at HEAD with signed evidence artifacts.
#
# NOTHING in this repository is `production` today: the default branch has no
# associated CI run at HEAD and no signed evidence artifacts exist yet. That
# is the Phase 0 finding this register records honestly. A component is
# promoted ONLY by adding an `evidence` pointer to a reproducible artifact.

schema_version: 1
