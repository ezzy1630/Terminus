[package]
name = "terminus-kernel-mini"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Terminus kernel HTTP mini-service (port 3040) — the non-bypassable effect boundary."

# This crate is intentionally NOT a member of the root workspace; it has its
# own (empty) [workspace] table so `cargo build` inside this directory does
# not compile the entire crate graph every time.
[workspace]

# Lint levels mirror the root workspace (SPEC §44.2). This crate is outside
# the root workspace, so it carries its own [lints] table rather than
# inheriting. `clippy::all`, `unwrap_used`/`expect_used`/`panic`, `unsafe_code`,
# and `unused_must_use` are denied; pedantic/nursery are advisory (warn).
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"
unwrap_used = { level = "deny", priority = 1 }
expect_used = { level = "deny", priority = 1 }
panic = { level = "deny", priority = 1 }

[dependencies]
# Terminus kernel crates (path deps to the workspace crates).
terminus-kernel = { path = "../../crates/terminus-kernel", version = "0.1.0" }
terminus-kernel-protocol = { path = "../../crates/terminus-kernel-protocol", version = "0.1.0" }
terminus-artifacts = { path = "../../crates/terminus-artifacts", version = "0.1.0" }
terminus-fs = { path = "../../crates/terminus-fs", version = "0.1.0" }
terminus-policy = { path = "../../crates/terminus-policy", version = "0.1.0" }
terminus-sandbox = { path = "../../crates/terminus-sandbox", version = "0.1.0" }
terminus-sandbox-linux = { path = "../../crates/terminus-sandbox-linux", version = "0.1.0" }
terminus-process = { path = "../../crates/terminus-process", version = "0.1.0" }
terminus-jobs = { path = "../../crates/terminus-jobs", version = "0.1.0" }
terminus-patch = { path = "../../crates/terminus-patch", version = "0.1.0" }
terminus-secrets = { path = "../../crates/terminus-secrets", version = "0.1.0" }
terminus-connector = { path = "../../crates/terminus-connector", version = "0.1.0" }
terminus-egress = { path = "../../crates/terminus-egress", version = "0.1.0" }
terminus-code-intel = { path = "../../crates/terminus-code-intel", version = "0.1.0" }
terminus-extension-runtime = { path = "../../crates/terminus-extension-runtime", version = "0.1.0" }
terminus-git = { path = "../../crates/terminus-git", version = "0.1.0" }
terminus-authz = { path = "../../crates/terminus-authz", version = "0.1.0" }

# HTTP stack.
axum = { version = "0.7", features = ["json", "http1", "tokio"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5" }
hyper = { version = "1", features = ["http1", "server"] }
http-body-util = "0.1"
http = "1"
http-body = "1"
futures-util = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"

# Serialization / utilities.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid = { version = "1", features = ["v7", "serde"] }
url = "2"
nix = { version = "0.29", features = ["process"] }

# gRPC-over-UDS transport (ADR-0007, SPEC §30.1 Boundary B). The .proto is
# canonical; these hand-written prost messages mirror it as a bootstrap
# bridge until prost-build codegen via buf is wired in CI (M3 completion).
# The UDS binding + tonic server + capability-token RequestContext here prove
# the transport contract; the HTTP bootstrap remains the default path.
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
prost-types = "0.13"
terminus-remote = { path = "../../crates/terminus-remote", version = "0.1.0" }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
