[package]
name = "forge-kernel-mini"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Forge kernel HTTP mini-service (port 3040) — the non-bypassable effect boundary."

# This crate is intentionally NOT a member of the root workspace; it has its
# own (empty) [workspace] table so `cargo build` inside this directory does
# not compile the entire crate graph every time.
[workspace]

[dependencies]
# Forge kernel crates (path deps to the workspace crates).
forge-kernel = { path = "../../crates/forge-kernel" }
forge-kernel-protocol = { path = "../../crates/forge-kernel-protocol" }
forge-artifacts = { path = "../../crates/forge-artifacts" }
forge-fs = { path = "../../crates/forge-fs" }
forge-policy = { path = "../../crates/forge-policy" }
forge-sandbox = { path = "../../crates/forge-sandbox" }
forge-process = { path = "../../crates/forge-process" }
forge-jobs = { path = "../../crates/forge-jobs" }
forge-patch = { path = "../../crates/forge-patch" }
forge-secrets = { path = "../../crates/forge-secrets" }
forge-egress = { path = "../../crates/forge-egress" }
forge-code-intel = { path = "../../crates/forge-code-intel" }
forge-extension-runtime = { path = "../../crates/forge-extension-runtime" }
forge-git = { path = "../../crates/forge-git" }
forge-authz = { path = "../../crates/forge-authz" }

# HTTP stack.
axum = { version = "0.7", features = ["json", "http1", "tokio"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5" }
hyper = { version = "1", features = ["http1", "server"] }
http-body-util = "0.1"
futures-util = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"

# Serialization / utilities.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid = { version = "1", features = ["v7", "serde"] }
url = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
