# Secret broker policy (SPEC §13.3, §13.6, §36.4).
#
# The kernel's SecretBroker consults this file when a tool requests a
# `secret://...` capability. The model never receives the raw secret value;
# instead, the broker obtains a short-lived credential, injects it into one
# isolated process, redacts matching output, records the use, and revokes
# afterward.

policy:
  id: secrets-default
  version: 1
  description: |
    Default secret broker policy. Denies ambient environment, denies model
    visibility, and lists brokered capabilities. Each capability is scoped
    to a destination set and an operation class.

  ambient_environment: deny
  model_visibility: deny
  brokered_capabilities_required: true

  # Common ambient env vars are scrubbed before any child process is spawned.
  # The model never sees these values, and even kernel-authorized child
  # processes do not inherit them unless the broker explicitly injects a
  # replacement.
  scrubbed_env:
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_SESSION_TOKEN
    - GITHUB_TOKEN
    - GH_TOKEN
    - GITLAB_TOKEN
    - NPM_TOKEN
    - PYPI_TOKEN
    - GOOGLE_APPLICATION_CREDENTIALS
    - AZURE_CLIENT_SECRET
    - DATABASE_URL
    - DEBUG_PASSWORD

  brokered_capabilities:
    - id: secret://github/repo-read
      description: Short-lived GitHub PAT scoped to repo:read.
      destination_glob: "https://api.github.com/**"
      operation_class: NETWORK_READ
      ttl_seconds: 3600
      redact_patterns: ["gh[pousr]_[A-Za-z0-9]{36}"]
    - id: secret://github/repo-write
      description: Short-lived GitHub PAT scoped to repo:write.
      destination_glob: "https://api.github.com/**"
      operation_class: NETWORK_WRITE
      ttl_seconds: 1800
      approval_required: true
      redact_patterns: ["gh[pousr]_[A-Za-z0-9]{36}"]
    - id: secret://github/workflow-trigger
      description: Short-lived GitHub PAT scoped to workflow triggering.
      destination_glob: "https://api.github.com/**"
      operation_class: EXTERNAL_STATE_WRITE
      ttl_seconds: 900
      approval_required: true
      redact_patterns: ["gh[pousr]_[A-Za-z0-9]{36}"]
    - id: secret://gitlab/repo-read
      description: Short-lived GitLab PAT scoped to read_repository.
      destination_glob: "https://gitlab.com/api/v4/**"
      operation_class: NETWORK_READ
      ttl_seconds: 3600
      redact_patterns: ["glpat-[A-Za-z0-9_\\-]{20}"]
    - id: secret://gitlab/repo-write
      description: Short-lived GitLab PAT scoped to write_repository.
      destination_glob: "https://gitlab.com/api/v4/**"
      operation_class: NETWORK_WRITE
      ttl_seconds: 1800
      approval_required: true
      redact_patterns: ["glpat-[A-Za-z0-9_\\-]{20}"]
    - id: secret://database/dev-read-only
      description: Short-lived DB credential scoped to SELECT on dev schema.
      destination_glob: "postgres://dev-db.local/**"
      operation_class: NETWORK_READ
      ttl_seconds: 1800
      redact_patterns: ["postgres://[^:]+:[^@]+@"]
    - id: secret://database/dev-migrate
      description: Short-lived DB credential scoped to DDL on dev schema.
      destination_glob: "postgres://dev-db.local/**"
      operation_class: EXTERNAL_STATE_WRITE
      ttl_seconds: 900
      approval_required: true
      redact_patterns: ["postgres://[^:]+:[^@]+@"]
    - id: secret://aws/deploy/dev
      description: Short-lived AWS STS credential scoped to lambda:UpdateFunctionCode on dev.
      destination_glob: "https://lambda.*.amazonaws.com/**"
      operation_class: EXTERNAL_STATE_WRITE
      ttl_seconds: 900
      approval_required: true
      redact_patterns: ["AKIA[0-9A-Z]{16}"]
    - id: secret://providers/openai-enterprise
      description: Provider API key for OpenAI enterprise account.
      destination_glob: "https://api.openai.com/**"
      operation_class: NETWORK_WRITE
      ttl_seconds: 3600
      redact_patterns: ["sk-[A-Za-z0-9]{40,}"]
    - id: secret://providers/anthropic-enterprise
      description: Provider API key for Anthropic enterprise account.
      destination_glob: "https://api.anthropic.com/**"
      operation_class: NETWORK_WRITE
      ttl_seconds: 3600
      redact_patterns: ["sk-ant-[A-Za-z0-9_\\-]{80,}"]

  # Audit logging is mandatory and cannot be disabled by lower layers.
  audit:
    log_request: true
    log_use: true
    log_revocation: true
    log_value: false
    redact_in_audit_log: true

  # If the broker is unavailable (e.g., the secret store cannot be reached),
  # every request fails closed. The model receives a structured
  # `secret_unavailable` error and must surface it to the user.
  fail_closed: true
