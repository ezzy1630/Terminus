adapter:
  id: pi
  version: 0.1.0
  status: stub
  inner_harness_version: floating
  description: |
    Pi adapter. Pi is a minimal terminal agent with strong tool-call
    discipline and small context windows. It is a serious competitor
    on simple tasks (SPEC §3.7). Its context visibility is opaque, so
    Terminus wraps it in a strict outer sandbox and supplies brokered
    network and secrets.
  capabilities:
    exact_context_visibility: opaque
    tool_interception: none
    filesystem_enforcement: outer_sandbox
    network_enforcement: outer_sandbox
    secret_isolation: outer_broker
    session_resume: none
    typed_results: parsed
    artifact_export: partial
    cancellation: best_effort
    model_selection: opaque
    native_compaction: false
  # Roadmap Phase 0 truth fix: no live capability probe has ever been run
  # against this adapter. The previously recorded "probe" block and its
  # discrepancy list were unreproducible placeholders and have been removed.
  # Capabilities above are declared design intent only; observed_by_probe is
  # filled exclusively by a real terminus-probe conformance run.
  observed_by_probe: null
  discrepancies: []
  last_verified: null
  result_schema: terminus.worker.v1
  notes: |
    Pi is selected as a baseline (SPEC §41.2) and as a comparison
    point for "minimal harness" research. Its tool-call discipline is
    strong for simple tasks; its weakness on long-horizon tasks is the
    expected signal in cohort comparisons.
