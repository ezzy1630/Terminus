adapter:
  id: claude-code
  version: 0.1.0
  status: stub
  inner_harness_version: floating
  description: |
    Anthropic Claude Code adapter. Claude Code is a strong implementer
    with native tool-use and structured output. Its session resume is
    emulated; its context visibility is partial. Terminus supplies an outer
    sandbox, brokered network, and brokered secrets.
  capabilities:
    exact_context_visibility: partial
    tool_interception: partial
    filesystem_enforcement: outer_sandbox
    network_enforcement: outer_sandbox
    secret_isolation: outer_broker
    session_resume: emulated
    typed_results: native
    artifact_export: complete
    cancellation: best_effort
    model_selection: constrained
    native_compaction: true
  # Roadmap Phase 0 truth fix: no live capability probe has ever been run
  # against this adapter. The previously recorded "probe" block and its
  # discrepancy list were unreproducible placeholders and have been removed.
  # Capabilities above are declared design intent only; observed_by_probe is
  # filled exclusively by a real terminus-probe conformance run.
  observed_by_probe: null
  discrepancies: []
  last_verified: null
  result_schema: terminus.worker.v1
  notes: |
    The adapter is enabled for tasks where Claude Code's strengths
    (strong implementer, structured output) outweigh the cost of
    supplying outer controls. Automation and licensing constraints may
    apply; see SPEC §41.2.
