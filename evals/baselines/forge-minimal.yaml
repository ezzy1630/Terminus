baseline:
  id: terminus-minimal
  version: 1
  description: |
    Executable Terminus minimal control profile. This file keeps its legacy
    forge-minimal filename, but its id, version, tools, and feature flags bind
    the runtime profile in agent/minimal-profile.ts.
  status: executable_default
  harness: terminus
  harness_commit: 0000000000000000000000000000000000000000
  configuration:
    orchestration:
      default: single_agent
      scouts: {enabled: false}
      writers: {enabled: false}
      reviewer: {enabled: false}
    context:
      compiler_version: v1
      recent_episode_policy:
        mode: fixed
        minimum_complete_episodes: 0
        maximum_complete_episodes: 3
      memory: {enabled: false}
      compaction:
        semantic_boundaries: false
        projected_context_threshold: 1.0
        validate_checkpoint: false
      external_compression: {enabled: false}
    aci:
      default_tools: [read, patch, write, exec, exec_poll, grep, glob]
    routing:
      mode: deterministic
      max_provider_attempts_per_turn: 1
      learned_router: {enabled: false}
  expected_behavior:
    - no delegation, no scout, no reviewer
    - no memory retrieval
    - no compaction
    - single provider attempt per turn
  use_in_cohorts:
    - tiny-bugfix
    - terminal-bench
    - swe-bench-verified
