// Terminus kernel RPC protocol — canonical source of truth (SPEC §7.1, §31, Appendix D).
//
// This .proto is the source of truth for the kernel protocol even though the
// mini-service implementation uses JSON-over-HTTP during bootstrap. Buf
// breaking-change checks run in CI (SPEC §45.4).
//
// Compatibility rules (SPEC §45.4):
//   - Never reuse field numbers.
//   - Removed fields are `reserved`.
//   - Add optional fields rather than changing meaning.
//   - Avoid maps where deterministic order matters on the wire or in hashes.
//   - Enumerations reserve `UNSPECIFIED = 0`.
//   - Bytes and strings have documented size limits.
//   - Oneof evolution is tested.

syntax = "proto3";

package terminus.kernel.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// =============================================================================
// Common types
// =============================================================================

// RequestContext is carried by every privileged kernel RPC. The capability
// token MUST be validated against the kernel's instance identity before any
// effect is authorized (SPEC §31.6).
message RequestContext {
  string request_id = 1;          // UUIDv7
  string idempotency_key = 2;     // Stable client-generated key for retries
  string session_id = 3;
  string task_id = 4;
  string turn_id = 5;
  string actor_id = 6;            // Principal driving the request
  string traceparent = 7;         // W3C Trace Context
  string capability_token = 8;    // Short-lived kernel-issued capability
  string workspace_id = 9;
  google.protobuf.Timestamp deadline = 10;
  ResourceBudgets resource_budgets = 11;
  string policy_version = 12;
}

message ResourceBudgets {
  uint64 max_cpu_milliseconds = 1;
  uint64 max_memory_bytes = 2;
  uint64 max_output_bytes = 3;
  uint64 max_wallclock_seconds = 4;
}

// ArtifactRef references an immutable blob in the content-addressed store
// (SPEC §29.3). `sha256` is the canonical `sha256:<hex>` form.
message ArtifactRef {
  string sha256 = 1;
  uint64 size_bytes = 2;
  string media_type = 3;
}

// EffectIntent binds the request to the user's intent and the policy decision.
// Taint sources propagate from untrusted content (Z5) into downstream policy
// (SPEC §27.3, §36.15).
message EffectIntent {
  string user_intent_ref = 1;          // URI of task contract / approval
  string task_contract_hash = 2;       // sha256 of the active contract
  string trust_label = 3;              // trusted | derived | untrusted
  string confidentiality_label = 4;    // public | workspace | secret_adjacent | secret
  repeated string taint_sources = 5;   // URIs of untrusted provenance
  string policy_profile_id = 6;        // e.g. secure-local-default
  string expected_effect_class = 7;    // SPEC §27.3 taxonomy
}

message WorkspacePath {
  string workspace_id = 1;
  string relative_path = 2;            // Canonicalized within the workspace root
}

message SourceVersion {
  WorkspacePath path = 1;
  string sha256 = 2;
  string repository_revision = 3;      // Git commit SHA or "no-vcs"
}

message LineRange {
  uint32 start_line = 1;
  uint32 end_line = 2;
}

message Elision {
  LineRange range = 1;
  string reason = 2;
}

message Diagnostic {
  WorkspacePath path = 1;
  uint32 start_line = 2;
  uint32 start_column = 3;
  uint32 end_line = 4;
  uint32 end_column = 5;
  string severity = 6;     // error | warning | info | hint
  string source = 7;       // e.g. "tsc", "rustc", "pyright"
  string code = 8;
  string message = 9;
}

message PolicyDecision {
  string decision_id = 1;
  string decision = 2;           // allow | deny | prompt
  repeated string rule_ids = 3;
  string explanation = 4;        // Safe, non-secret explanation
}

// =============================================================================
// File service (SPEC §11.5, §34.5)
// =============================================================================

message ReadFileRequest {
  RequestContext context = 1;
  EffectIntent intent = 2;
  WorkspacePath path = 3;
  string mode = 4;                       // full | outline | ranges | symbols
  repeated LineRange ranges = 5;
  repeated string symbols = 6;
  uint64 max_bytes = 7;                  // Hard cap; truncation MUST be reported
  string expected_sha256 = 8;            // Stale-write protection
}

message ReadFileResponse {
  SourceVersion source_version = 1;
  string rendered_mode = 2;              // The mode actually used
  ArtifactRef full_content = 3;          // Always available, may be elided in projection
  bytes model_projection_utf8 = 4;       // What the model actually sees
  repeated Elision elisions = 5;
  repeated Diagnostic diagnostics = 6;
  bool truncated = 7;                    // MUST be true if max_bytes hit
  string continuation_token = 8;         // Opaque cursor for next page
}

// =============================================================================
// Patch service (SPEC §11.6, §34.7, §34.8, §34.9)
// =============================================================================

message WorkspaceBaseline {
  string workspace_id = 1;
  string repository_revision = 2;
  string dirty_digest = 3;               // sha256 of the dirty working set
  repeated SourceVersion sources = 4;    // Per-file hashes (anchor set)
}

enum PatchCommitMode {
  PATCH_COMMIT_MODE_UNSPECIFIED = 0;
  PATCH_COMMIT_MODE_PREVIEW_ONLY = 1;        // Validate, write nothing
  PATCH_COMMIT_MODE_STAGE_ONLY = 2;          // Stage to journal
  PATCH_COMMIT_MODE_APPLY_TO_WORKTREE = 3;   // Commit to working tree
}

message PatchRequest {
  RequestContext context = 1;
  EffectIntent intent = 2;
  string transaction_id = 3;             // Idempotency / journal key
  WorkspaceBaseline baseline = 4;        // Snapshot anchor
  repeated PatchEdit edits = 5;
  string validation_profile_id = 6;      // e.g. "format-and-parse"
  bool allow_transient_invalid_state = 7;
  PatchCommitMode commit_mode = 8;
}

message PatchEdit {
  oneof edit {
    ReplaceSymbol replace_symbol = 10;
    ReplaceRange replace_range = 11;
    ReplaceExactText replace_exact_text = 12;
    InsertContent insert = 13;
    DeleteRange delete_range = 14;
    CreateFile create_file = 15;
    MoveFile move_file = 16;
    DeleteFile delete_file = 17;
    UnifiedDiff unified_diff = 18;
    ReplaceHashline replace_hashline = 19;
  }
}

message ReplaceSymbol {
  WorkspacePath path = 1;
  string expected_sha256 = 2;
  string symbol = 3;
  string structural_fingerprint = 4;     // Tree-sitter AST fingerprint
  bytes replacement_utf8 = 5;
}

message ReplaceRange {
  WorkspacePath path = 1;
  string expected_sha256 = 2;
  LineRange range = 3;
  bytes replacement_utf8 = 4;
}

message ReplaceHashline {
  WorkspacePath path = 1;
  string expected_sha256 = 2;
  repeated string line_hashes = 3;       // short or full SHA-256 per line
  uint32 start_line = 4;                // 1-based inclusive
  uint32 end_line = 5;                  // 1-based inclusive
  bytes replacement_utf8 = 6;
}

message ReplaceExactText {
  WorkspacePath path = 1;
  string expected_sha256 = 2;
  bytes expected_utf8 = 3;
  bytes replacement_utf8 = 4;
  bool require_unique = 5;               // Reject if expected text appears >1 time
}

message InsertContent {
  WorkspacePath path = 1;
  string expected_sha256 = 2;
  string anchor_kind = 3;                // symbol | line | range-start | range-end | eof
  string anchor = 4;
  string position = 5;                   // before | after | replace
  bytes content_utf8 = 6;
}

message DeleteRange {
  WorkspacePath path = 1;
  string expected_sha256 = 2;
  LineRange range = 3;
}

message CreateFile {
  WorkspacePath path = 1;
  bool must_not_exist = 2;               // Blind-create guard
  bytes content = 3;
  string media_type = 4;
}

message MoveFile {
  WorkspacePath from = 1;
  WorkspacePath to = 2;
  string expected_sha256 = 3;
  bool target_must_not_exist = 4;
}

message DeleteFile {
  WorkspacePath path = 1;
  string expected_sha256 = 2;
}

message UnifiedDiff {
  string repository_revision = 1;
  bytes diff_utf8 = 2;
}

message ChangedFile {
  WorkspacePath path = 1;
  string old_sha256 = 2;
  string new_sha256 = 3;
  string operation = 4;                  // create | modify | move | delete
}

message ValidationResult {
  string check_id = 1;                   // e.g. "rustfmt", "tsc", "parse"
  string status = 2;                     // pass | fail | skipped
  string summary = 3;
  ArtifactRef evidence = 4;              // Diagnostic output artifact
}

message PatchResponse {
  string transaction_id = 1;
  string state = 2;                      // staged | applied | rolled-back | failed
  string final_repository_revision = 3;
  string final_dirty_digest = 4;
  repeated ChangedFile changed_files = 5;
  repeated ValidationResult validations = 6;
  ArtifactRef complete_diff = 7;         // Full unified diff artifact
}

message PatchReconcileRequest {
  RequestContext context = 1;
  string transaction_id = 2;             // Unknown-settlement reconciliation
}

// =============================================================================
// Process / exec service (SPEC §11.7, §34.11)
// =============================================================================

message ShellSpec {
  bool enabled = 1;
  string dialect = 2;                    // bash | sh | powershell | cmd
  string script = 3;                     // Normalized script (NOT raw user input)
}

message CommandSpec {
  string program = 1;
  repeated string args = 2;
  WorkspacePath cwd = 3;
  map<string, string> public_env = 4;    // Non-secret env only
  repeated string secret_capability_uris = 5;  // Broker handles injection
  google.protobuf.Duration timeout = 6;
  bool allocate_pty = 7;
  ShellSpec shell = 8;
  // Explicit opt-in for an unbounded runtime. When false (the default) an
  // absent or zero `timeout` is replaced by the server-side class default
  // (exec 120s, job 30min) instead of running forever. Policy and sandbox
  // wall-clock constraints still clamp the effective value.
  bool allow_unbounded_timeout = 9;
}

message StartProcessRequest {
  RequestContext context = 1;
  EffectIntent intent = 2;
  CommandSpec command = 3;
  string sandbox_profile_id = 4;         // e.g. "secure-local-default"
  string output_policy_id = 5;           // Redaction / truncation policy
}

message ProcessStarted {
  string process_id = 1;
  string job_id = 2;
  string resolved_executable = 3;        // Post-canonicalization
  google.protobuf.Timestamp started_at = 4;
}

message OutputChunk {
  uint64 cursor = 1;                     // Monotonic per stream
  bytes bytes = 2;
  bool redacted = 3;                     // True if secrets were stripped
}

message ProcessExited {
  int32 exit_code = 1;
  string signal = 2;                     // Empty if normal exit
  google.protobuf.Timestamp exited_at = 3;
  ArtifactRef stdout_artifact = 4;       // Full output spilled to CAS
  ArtifactRef stderr_artifact = 5;
}

message ProcessEvent {
  uint64 sequence = 1;                   // Monotonic per process
  google.protobuf.Timestamp occurred_at = 2;
  oneof event {
    ProcessStarted started = 10;
    OutputChunk stdout = 11;
    OutputChunk stderr = 12;
    ProcessExited exited = 13;
    PolicyDecision policy = 14;          // Pre-exec policy decision
  }
}

message CancelProcessRequest {
  RequestContext context = 1;
  string process_id = 2;
  string reason = 3;                     // e.g. "timeout", "user-cancel", "budget-exceeded"
}

message CancelProcessResponse {
  string state = 1;                      // cancelled | already-exited | unknown
}

// =============================================================================
// Job service (SPEC §11.7, §34.12) — durable, restart-survivable processes
// =============================================================================

message StartJobRequest {
  RequestContext context = 1;
  EffectIntent intent = 2;
  CommandSpec command = 3;
  string sandbox_profile_id = 4;
  string output_policy_id = 5;
  bool durable = 6;                      // Survives control-plane restart
}

message StartJobResponse {
  string job_id = 1;
  string process_id = 2;
  google.protobuf.Timestamp started_at = 3;
}

message JobStreamRequest {
  RequestContext context = 1;
  string job_id = 2;
  uint64 from_sequence = 3;              // Resume cursor (SSE-style)
}

message JobEvent {
  uint64 sequence = 1;
  google.protobuf.Timestamp occurred_at = 2;
  oneof event {
    ProcessStarted started = 10;
    OutputChunk stdout = 11;
    OutputChunk stderr = 12;
    ProcessExited exited = 13;
    PolicyDecision policy = 14;
    JobReconciled reconciled = 15;       // Emitted on restart recovery
  }
}

message JobReconciled {
  string state = 1;                      // running | exited | unknown-settlement
  string explanation = 2;
}

message JobInputRequest {
  RequestContext context = 1;
  string job_id = 2;
  bytes stdin = 3;
}

message JobSignalRequest {
  RequestContext context = 1;
  string job_id = 2;
  string signal = 3;                     // SIGTERM, SIGKILL, etc.
}

message JobStopRequest {
  RequestContext context = 1;
  string job_id = 2;
  string reason = 3;
}

message JobGetRequest {
  RequestContext context = 1;
  string job_id = 2;
}

message JobState {
  string job_id = 1;
  string state = 2;                      // queued | running | exited | unknown
  int32 exit_code = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp exited_at = 5;
  ArtifactRef stdout_artifact = 6;
  ArtifactRef stderr_artifact = 7;
}

// =============================================================================
// Kernel info / health
// =============================================================================

message KernelInfo {
  string version = 1;
  string protocol_version = 2;           // e.g. "terminus.kernel.v1"
  string build_revision = 3;
  repeated string supported_backends = 4;  // linux-bwrap | macos-sandbox | windows | container | microvm
  repeated string supported_services = 5;
  // Stable kernel identity for capability-token audience + mTLS SAN binding
  // (SPEC §48.14). Format: `kernel:<opaque>`.
  string instance_id = 6;
}

message KernelHealth {
  string state = 1;                      // healthy | degraded | failing
  repeated string degradations = 2;      // Empty if healthy
  google.protobuf.Timestamp checked_at = 3;
}

message BootstrapControlRequest {
  string principal = 1;                  // Must equal the configured control principal
}

message BootstrapControlCapabilities {
  string broker_capability_token = 1;    // Admin, bound to task control-broker
  string maintenance_capability_token = 2; // Admin, bound to task control-maintenance
  uint64 expires_at_unix = 3;
}

// =============================================================================
// Services (SPEC §31.1)
// =============================================================================

service KernelInfoService {
  rpc GetInfo(google.protobuf.Empty) returns (KernelInfo);
  rpc Health(google.protobuf.Empty) returns (KernelHealth);
  // Restricted-UDS-only standalone bootstrap. Never exposed by HTTP/TCP.
  rpc BootstrapControl(BootstrapControlRequest) returns (BootstrapControlCapabilities);
}

service FileService {
  rpc Read(ReadFileRequest) returns (ReadFileResponse);
}

service PatchService {
  rpc Apply(PatchRequest) returns (PatchResponse);
  rpc Reconcile(PatchReconcileRequest) returns (PatchResponse);
}

service ProcessService {
  rpc Start(StartProcessRequest) returns (stream ProcessEvent);
  rpc Cancel(CancelProcessRequest) returns (CancelProcessResponse);
}

service JobService {
  rpc Start(StartJobRequest) returns (StartJobResponse);
  rpc Stream(JobStreamRequest) returns (stream JobEvent);
  rpc Input(JobInputRequest) returns (JobState);
  rpc Signal(JobSignalRequest) returns (JobState);
  rpc Stop(JobStopRequest) returns (JobState);
  rpc Get(JobGetRequest) returns (JobState);
}

// =============================================================================
// Governed browser computer-use service (ADR-0041, SPEC §25)
// =============================================================================

// Computer use is deliberately a separate capability from generic process,
// network, and artifact access. The kernel must own the browser lease and
// reject requests when no authenticated, isolated adapter is configured.
message ComputerObserveRequest {
  RequestContext context = 1;
  EffectIntent intent = 2;
  string browser_session_id = 3;
  uint32 viewport_width = 4;
  uint32 viewport_height = 5;
  uint64 max_screenshot_bytes = 6;
}

message SemanticBrowserTarget {
  string target_id = 1;
  string role = 2;
  string accessible_name = 3;
  string selector = 4;
  double x = 5;
  double y = 6;
  double width = 7;
  double height = 8;
  string text_snippet = 9;
  double confidence = 10;
  string semantic_hash = 11;
}

message ComputerObservation {
  string observation_id = 1;
  uint64 observation_version = 2;
  string browser_session_id = 3;
  string url = 4;
  string title = 5;
  uint32 viewport_width = 6;
  uint32 viewport_height = 7;
  ArtifactRef screenshot = 8;
  ArtifactRef semantic_tree = 9;
  repeated SemanticBrowserTarget targets = 10;
  bool screenshot_truncated = 11;
  string continuation_token = 12;
  ArtifactRef receipt = 13;
  string trust_label = 14;
}

message ComputerObserveResponse {
  ComputerObservation observation = 1;
}

enum ComputerActionKind {
  COMPUTER_ACTION_UNSPECIFIED = 0;
  COMPUTER_ACTION_NAVIGATE = 1;
  COMPUTER_ACTION_CLICK = 2;
  COMPUTER_ACTION_TYPE_TEXT = 3;
  COMPUTER_ACTION_SCROLL = 4;
  COMPUTER_ACTION_WAIT = 5;
}

message ComputerActRequest {
  RequestContext context = 1;
  EffectIntent intent = 2;
  string browser_session_id = 3;
  string observation_id = 4;
  uint64 observation_version = 5;
  ComputerActionKind action = 6;
  string target_id = 7;
  string navigation_url = 8;
  string text = 9;
  double scroll_x = 10;
  double scroll_y = 11;
  uint64 wait_ms = 12;
  string origin = 13;
  string approval_id = 14;
}

message ComputerActResponse {
  string action_id = 1;
  string outcome = 2;
  ComputerObservation pre_observation = 3;
  ComputerObservation post_observation = 4;
  ArtifactRef receipt = 5;
  string failure_reason = 6;
}

service ComputerUseService {
  rpc Observe(ComputerObserveRequest) returns (ComputerObserveResponse);
  rpc Act(ComputerActRequest) returns (ComputerActResponse);
}

// =============================================================================
// Workspace service (SPEC §31.1)
// =============================================================================

message RegisterWorkspaceRequest {
  RequestContext context = 1;
  string root_uri = 2;
  string canonical_root = 3;
  string trust = 4;             // trusted | untrusted | restricted
  // Optional remote environment descriptor JSON (SPEC §48.14). Empty for local.
  string remote_environment_json = 5;
  // workspace | container | microvm | remote
  string kind = 6;
  // Existing control-plane identity to preserve during registry migration.
  // Empty for a new workspace. Admin authorization is required by the RPC.
  string requested_workspace_id = 7;
}

message WorkspaceEntryMessage {
  string id = 1;
  string root_uri = 2;
  string canonical_root = 3;
  string trust = 4;
}

message ResolveWorkspaceRootRequest {
  RequestContext context = 1;
  string root_uri = 2;
  string candidate_root = 3;
}

message ResolvedWorkspaceRootMessage {
  string root_uri = 1;
  string canonical_root = 2;
}

message GetWorkspaceRequest {
  RequestContext context = 1;
  string workspace_id = 2;
}

service WorkspaceService {
  // Read-only canonicalization used before durable identity/trust admission.
  rpc ResolveRoot(ResolveWorkspaceRootRequest) returns (ResolvedWorkspaceRootMessage);
  rpc Register(RegisterWorkspaceRequest) returns (WorkspaceEntryMessage);
  rpc Get(GetWorkspaceRequest) returns (WorkspaceEntryMessage);
}

// =============================================================================
// Sandbox service (SPEC §13, §31.1)
// =============================================================================

enum EnforcementStatusProto {
  ENFORCEMENT_STATUS_UNSPECIFIED = 0;
  ENFORCED_STATUS = 1;
  DEGRADED_STATUS = 2;
  UNSUPPORTED_STATUS = 3;
}

message EnforcementReportMessage {
  string backend_id = 1;
  EnforcementStatusProto status = 2;
  repeated string enforced = 3;
  repeated string degraded = 4;
  repeated string unsupported = 5;
  repeated string notes = 6;
}

message SandboxReportRequest {
  RequestContext context = 1;
  string profile_id = 2;
}

service SandboxService {
  rpc Report(SandboxReportRequest) returns (EnforcementReportMessage);
}

// =============================================================================
// Policy service (SPEC §13.5, §31.1)
// =============================================================================

enum DecisionProto {
  DECISION_UNSPECIFIED = 0;
  DECISION_ALLOW = 1;
  DECISION_ALLOW_WITH_CONSTRAINTS = 2;
  DECISION_PROMPT = 3;
  DECISION_DENY = 4;
}

message NormalizedCommandMessage {
  string resolved_executable = 1;
  repeated string argv = 2;
  string working_directory = 3;
  repeated string effect_types = 4;
  repeated string taint_sources = 5;
}

message ConstraintMessage {
  optional uint64 max_runtime_ms = 1;
  optional uint64 max_output_bytes = 2;
  repeated string disallowed_env = 3;
}

message DecisionReportMessage {
  DecisionProto decision = 1;
  repeated string rule_ids = 2;
  string explanation = 3;
  string decision_id = 4;
  ConstraintMessage constraints = 5;
}

message EvaluatePolicyRequest {
  RequestContext context = 1;
  NormalizedCommandMessage command = 2;
}

enum CapabilityOperationProto {
  CAPABILITY_OPERATION_UNSPECIFIED = 0;
  CAPABILITY_OPERATION_READ = 1;
  CAPABILITY_OPERATION_PATCH = 2;
  CAPABILITY_OPERATION_EXEC = 3;
  CAPABILITY_OPERATION_JOB = 4;
  CAPABILITY_OPERATION_SANDBOX = 5;
  CAPABILITY_OPERATION_SECRET = 6;
  CAPABILITY_OPERATION_NETWORK = 7;
  CAPABILITY_OPERATION_CODE_INTEL = 8;
  CAPABILITY_OPERATION_EXTENSION = 9;
  CAPABILITY_OPERATION_GIT = 10;
  CAPABILITY_OPERATION_ARTIFACT_INGEST = 11;
  CAPABILITY_OPERATION_COMPUTER_USE = 12;
}

message MintTaskCapabilityRequest {
  RequestContext context = 1;            // Admin broker capability
  string principal = 2;
  string session_id = 3;
  string task_id = 4;
  string workspace_id = 5;
  repeated CapabilityOperationProto operation_classes = 6;
  repeated string workspace_paths = 7;
  repeated string network_destinations = 8;
  repeated string secret_capabilities = 9;
  uint64 ttl_seconds = 10;                // 1..300
}

message MintTaskCapabilityResponse {
  string capability_token = 1;
  uint64 expires_at_unix = 2;
}

service PolicyService {
  rpc Evaluate(EvaluatePolicyRequest) returns (DecisionReportMessage);
  rpc MintTaskCapability(MintTaskCapabilityRequest) returns (MintTaskCapabilityResponse);
}

// =============================================================================
// Secret service (SPEC §13.6, §31.1)
// =============================================================================

message MintSecretRequest {
  RequestContext context = 1;
  string capability_uri = 2;    // e.g. secret://providers/openai/api_key
  uint64 ttl_seconds = 3;
}

message SecretCapabilityMessage {
  string capability_uri = 1;
  string handle = 2;            // opaque, model-visible handle (never the value)
  uint64 expires_at_unix = 3;
}

message StoreSecretRequest {
  RequestContext context = 1;
  string capability_uri = 2;
  bytes value = 3;              // Maximum 16 KiB; never logged or persisted outside OS keyring
}

message DeleteSecretRequest {
  RequestContext context = 1;
  string capability_uri = 2;
}

message SecretMutationResponse {
  string capability_uri = 1;
  bool stored = 2;
}

// Metadata-only result of checking a secret capability. UNSPECIFIED is the
// protobuf default and is never authoritative; callers must treat it as an
// indeterminate result rather than as absence.
enum SecretPresenceProto {
  SECRET_PRESENCE_UNSPECIFIED = 0;
  SECRET_PRESENCE_PRESENT = 1;
  SECRET_PRESENCE_MISSING = 2;
  SECRET_PRESENCE_UNAVAILABLE = 3;
}

message InspectSecretRequest {
  RequestContext context = 1;
  string capability_uri = 2;
}

message InspectSecretResponse {
  string capability_uri = 1;
  SecretPresenceProto presence = 2;
}

service SecretService {
  rpc Mint(MintSecretRequest) returns (SecretCapabilityMessage);
  rpc Store(StoreSecretRequest) returns (SecretMutationResponse);
  rpc Delete(DeleteSecretRequest) returns (SecretMutationResponse);
  rpc Inspect(InspectSecretRequest) returns (InspectSecretResponse);
}

// =============================================================================
// Provider account service — credentials already on this machine
// =============================================================================
//
// Terminus's own loop drives every model; other local tools are only a place
// credentials already live. The kernel reads those stores and moves a
// credential straight into the OS keyring under
// `secret://provider-account/<uuid-v7>`. Secret bytes never cross this
// boundary: discovery returns identity and a non-reversible fingerprint, and
// import returns the capability URI it stored under.

// A credential found in a local tool's store. Never carries secret bytes.
message LocalProviderCredentialMessage {
  // Stable source id: "opencode:<providerID>" (an OpenCode auth-store entry)
  // only OpenCode auth-store entries are returned. Codex CLI credentials are
  // intentionally never read; a future App Server lane owns that login.
  string source = 1;
  // "api" | "oauth" | "wellknown" | "chatgpt".
  string auth_kind = 2;
  // Full lowercase SHA-256 digest over the secret bytes, so approval binds to
  // exact bytes without the key ever being seen.
  string fingerprint = 3;
  // Non-secret metadata as canonical JSON. Only allowlisted identity keys are
  // carried. Arbitrary provider/plugin metadata never crosses this boundary.
  // Current key: "account_id". Absent keys are omitted.
  string metadata_json = 4;
  // Unix seconds at which the credential expires; 0 when it does not.
  uint64 expires_at_unix = 5;
  // Which supported store it was read from: "opencode-auth-store".
  // A label, never a filesystem path.
  string store = 6;
}

message DiscoverLocalProviderCredentialsRequest {
  RequestContext context = 1;
}

message DiscoverLocalProviderCredentialsResponse {
  repeated LocalProviderCredentialMessage credentials = 1;
  // Stores that exist but could not be used, as "<store>: <reason>"
  // (unreadable, malformed, too permissive). Surfaced, never silently dropped.
  repeated string warnings = 2;
  // PATH lookups, so the client can say "install/sign in" precisely.
  bool codex_installed = 3;
  bool opencode_installed = 4;
  // The protobuf default is non-authoritative. Callers must not treat
  // REJECTED or UNAVAILABLE as authoritative absence.
  OpencodeStoreStatusProto opencode_store_status = 5;
}

enum OpencodeStoreStatusProto {
  OPENCODE_STORE_STATUS_UNSPECIFIED = 0;
  OPENCODE_STORE_STATUS_AVAILABLE = 1;
  OPENCODE_STORE_STATUS_MISSING = 2;
  OPENCODE_STORE_STATUS_REJECTED = 3;
  OPENCODE_STORE_STATUS_UNAVAILABLE = 4;
}

message ImportLocalProviderCredentialRequest {
  RequestContext context = 1;
  // Source id from discovery.
  string source = 2;
  // Destination minted by the control plane after explicit user consent:
  // secret://provider-account/<uuid-v7>. Requires a Secret-class capability
  // scoped to exactly this URI, as SecretService.Store does.
  string capability_uri = 3;
  // Full lowercase SHA-256 digest returned by the discovery record the user
  // approved. Import re-reads the store and refuses a rotated credential
  // rather than copying different bytes under stale consent.
  string expected_fingerprint = 4;
}

message ImportLocalProviderCredentialResponse {
  string capability_uri = 1;
  bool stored = 2;
  LocalProviderCredentialMessage credential = 3;
}

service ProviderAccountService {
  rpc DiscoverLocal(DiscoverLocalProviderCredentialsRequest) returns (DiscoverLocalProviderCredentialsResponse);
  rpc ImportLocal(ImportLocalProviderCredentialRequest) returns (ImportLocalProviderCredentialResponse);
}

// =============================================================================
// Network egress service (SPEC §13.3, §31.1, ADR-0015)
// =============================================================================

message EgressRequest {
  RequestContext context = 1;
  string destination = 2;       // host:port
  string method = 3;
}

message EgressDecisionMessage {
  bool allowed = 1;
  string reason = 2;
}

service NetworkService {
  rpc Decide(EgressRequest) returns (EgressDecisionMessage);
}

// =============================================================================
// Credentialed connector service (SPEC §17.3, ADR-0035, ADR-0044)
// =============================================================================

message ConnectorGrantBindingMessage {
  string connector_id = 1;
  string destination_host = 2;
  uint32 destination_port = 3;
  string scheme = 4;
  string method = 5;
  string path_class = 6;
  string effect_id = 7;
  // Per-account destination allowlist supplied by the control plane at mint
  // time. Required for connectors whose host is chosen per account (e.g.
  // `openai-compatible`); it must contain `destination_host`. Dispatch also
  // re-checks the host against the kernel's global egress union.
  repeated string allowed_hosts = 8;
}

message MintConnectorGrantRequest {
  RequestContext context = 1;
  string capability_uri = 2;
  ConnectorGrantBindingMessage binding = 3;
  uint64 ttl_seconds = 4;
}

message ConnectorGrantMessage {
  string encoded_grant = 1;
  string grant_id = 2;
  uint64 expires_at_unix = 3;
}

message ConnectorHeaderMessage {
  string name = 1;
  string value = 2;
}

message ConnectorOperationMessage {
  string method = 1;
  string scheme = 2;
  string host = 3;
  uint32 port = 4;
  string path = 5;
  string query = 6;
  repeated ConnectorHeaderMessage headers = 7;
  bytes body = 8;
}

message ExecuteConnectorRequest {
  RequestContext context = 1;
  string encoded_grant = 2;
  ConnectorOperationMessage operation = 3;
}

message ConnectorReceiptMessage {
  string grant_id = 1;
  string task_id = 2;
  string effect_id = 3;
  string connector_id = 4;
  string method = 5;
  string path = 6;
  string destination = 7;
  string request_sha256 = 8;
  optional uint32 status_code = 9;
  optional string response_sha256 = 10;
  uint64 response_redactions = 11;
  string outcome = 12;
  // Response headers admitted by the connector descriptor's response-header
  // allowlist (e.g. `x-codex-*`, `retry-after`, `x-ratelimit-*`). Bounded in
  // count and value length; never carries credential material.
  repeated ConnectorHeaderMessage response_headers = 13;
}

message ConnectorResponseMessage {
  ConnectorReceiptMessage receipt = 1;
  bytes body = 2;
  optional string content_type = 3;
}

service ConnectorService {
  rpc MintGrant(MintConnectorGrantRequest) returns (ConnectorGrantMessage);
  rpc Execute(ExecuteConnectorRequest) returns (ConnectorResponseMessage);
  // R6: incremental dispatch. Streams response body chunks as they arrive
  // and terminates with the same scrubbed receipt Execute returns. Grant
  // consumption, egress authorization, and bounded-capture limits are
  // identical to Execute; only the transport differs.
  rpc ExecuteStream(ExecuteConnectorRequest) returns (stream ConnectorChunk);
}

// Chunk of a streamed connector response. Exactly one terminal frame carries
// the receipt; every prior frame is a body chunk.
message ConnectorChunk {
  oneof payload {
    bytes bytes = 1;
    ConnectorReceiptMessage receipt = 2;
  }
}

// =============================================================================
// Code intelligence service (SPEC §11.8, §31.1)
// =============================================================================

message CodeSearchRequest {
  RequestContext context = 1;
  string workspace_id = 2;
  string query = 3;
  uint32 limit = 4;
}

message CodeSearchResult {
  string path = 1;
  uint32 line = 2;
  string symbol = 3;
  string method = 4;            // lexical_bm25 | tree_sitter | lsp | graph
}

message CodeSearchResponse {
  repeated CodeSearchResult results = 1;
  bool truncated = 2;
  optional string continuation = 3;
}

message RepositoryMapRequest {
  RequestContext context = 1;
  string workspace_id = 2;
  uint32 limit = 3;
  string continuation = 4;
}

message RepositoryMapEntry {
  string path = 1;
  repeated string symbols = 2;
  string source_sha256 = 3;              // Canonical sha256:<hex> source version
}

message RepositoryMapResponse {
  repeated RepositoryMapEntry entries = 1;
  string index_revision = 2;
  bool truncated = 3;
  optional string continuation = 4;
  uint32 total_entries = 5;
}

service CodeIntelligenceService {
  rpc Search(CodeSearchRequest) returns (CodeSearchResponse);
  rpc Map(RepositoryMapRequest) returns (RepositoryMapResponse);
}

// =============================================================================
// Extension runtime service (SPEC §12, §35, ADR-0019)
// =============================================================================

message ExtensionInvokeRequest {
  RequestContext context = 1;
  string capability_id = 2;
  string operation = 3;
  bytes input = 4;
}

message ExtensionInvokeResponse {
  bytes output = 1;
  bool ok = 2;
  string error = 3;
}

service ExtensionRuntimeService {
  rpc Invoke(ExtensionInvokeRequest) returns (ExtensionInvokeResponse);
}

// =============================================================================
// Artifact ingest service (SPEC §29.3, §31.1)
// =============================================================================

message IngestArtifactRequest {
  RequestContext context = 1;
  bytes content = 2;
  string media_type = 3;
}

message IngestArtifactResponse {
  ArtifactRef artifact = 1;
  bool already_present = 2;
}

message GetArtifactRequest {
  RequestContext context = 1;
  string sha256 = 2;
}

message GetArtifactResponse {
  ArtifactRef artifact = 1;
  bytes content = 2;
}

message GetArtifactMetadataRequest {
  RequestContext context = 1;
  string sha256 = 2;
}

message GetArtifactMetadataResponse {
  ArtifactRef artifact = 1;
}

message LinkArtifactRequest {
  RequestContext context = 1;
  string sha256 = 2;
  string owner_type = 3;
  string owner_id = 4;
  string purpose = 5;
  // Authoritative task aggregate that owns the admission. The kernel binds
  // this to both RequestContext.task_id and the capability token task binder.
  string owner_task_id = 6;
}

message LinkArtifactResponse {
  bool linked = 1;
}

message ListCheckpointArtifactLinksRequest {
  RequestContext context = 1;
  uint32 page_size = 2;
  string continuation_token = 3;
}

message CheckpointArtifactLinkMessage {
  string link_id = 1;
  string sha256 = 2;
  string checkpoint_id = 3;
  string owner_task_id = 4;
  string created_at = 5;
}

message ListCheckpointArtifactLinksResponse {
  repeated CheckpointArtifactLinkMessage links = 1;
  string continuation_token = 2;
}

message UnlinkCheckpointArtifactRequest {
  RequestContext context = 1;
  string sha256 = 2;
  string checkpoint_id = 3;
  string owner_task_id = 4;
}

message UnlinkCheckpointArtifactResponse {
  bool unlinked = 1;
}

service ArtifactIngestService {
  rpc Ingest(IngestArtifactRequest) returns (IngestArtifactResponse);
  rpc Get(GetArtifactRequest) returns (GetArtifactResponse);
  rpc GetMetadata(GetArtifactMetadataRequest) returns (GetArtifactMetadataResponse);
  rpc Link(LinkArtifactRequest) returns (LinkArtifactResponse);
  rpc ListCheckpointLinks(ListCheckpointArtifactLinksRequest) returns (ListCheckpointArtifactLinksResponse);
  rpc UnlinkCheckpoint(UnlinkCheckpointArtifactRequest) returns (UnlinkCheckpointArtifactResponse);
}

// The descriptor set is published with each kernel build (SPEC §31.1,
// Appendix D). All services carry a RequestContext and are subject to the
// §31.3 14-step validation pipeline.
