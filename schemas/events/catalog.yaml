# Terminus Semantic Event Catalog (SPEC §45.5).
#
# This is the source-of-truth catalog of semantic events emitted by the
# Terminus control plane and kernel. The codegen-events generator produces:
#   - runtime validators (TS zod, Rust serde);
#   - event type unions;
#   - JSON Schemas (in schemas/generated/);
#   - a Markdown catalog;
#   - synthetic test fixtures;
#   - migration compatibility tests.
#
# Each event has a stable `type` and `version`. Breaking changes require
# a new version; old versions are kept for backward-compat tests.

- type: workspace.registered
  version: 1
  aggregate: workspace
  payload:
    workspace_id: {type: uuid, required: true}
    root_uri: {type: string, required: true}
    trust_level: {type: string, enum: [trusted, untrusted], required: true}
  pii: none
  retention: audit

- type: session.created
  version: 1
  aggregate: session
  payload:
    session_id: {type: uuid, required: true}
    workspace_id: {type: uuid, required: true}
  pii: none
  retention: audit

- type: thread.created
  version: 1
  aggregate: thread
  payload:
    thread_id: {type: uuid, required: true}
    session_id: {type: uuid, required: true}
  pii: none
  retention: audit

- type: task.created
  version: 1
  aggregate: task
  payload:
    task_id: {type: uuid, required: true}
    thread_id: {type: uuid, required: true}
    contract_id: {type: uuid, required: true}
    objective: {type: string, required: false}
  pii: low
  retention: audit

- type: task.activated
  version: 1
