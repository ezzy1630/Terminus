[project]
name = "terminus-evals"
version = "0.1.0"
description = "Terminus offline evaluation and research laboratory (SPEC §18, §41, §43.3)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Terminus" }]
license = "LicenseRef-Proprietary"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pip-audit>=2.7",
    "types-PyYAML",
]

[project.scripts]
terminus-eval = "forge_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The evaluation package lives below the historical `forge_evals/` container
# directory. Point Hatch at the import-package directory so the editable
# installation used by `uv run terminus-eval` exposes `forge_evals.cli`.
packages = ["forge_evals/forge_evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tests/fixtures", ".venv", "forge_evals/tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["forge_evals/evals/tasks/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
# Third-party libs we depend on don't ship types in all cases; tolerate.
ignore_missing_imports = true
files = ["forge_evals"]

[[tool.mypy.overrides]]
module = ["polars.*", "pyarrow.*", "duckdb.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["forge_evals/forge_evals/tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running statistical tests",
    "integration: requires on-disk fixture",
]
