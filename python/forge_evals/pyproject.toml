[project]
name = "terminus-evals"
version = "0.1.0"
description = "Terminus evaluation laboratory — offline/non-privileged research plane (SPEC §18, §41, §43.3)."
requires-python = ">=3.12"
authors = [{ name = "Terminus" }]
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.0",
    "polars>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
analysis = [
    "duckdb>=1.0",
    "pyarrow>=15.0",
]
test = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
terminus-eval = "forge_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge_evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
