    statement: only src/version.py changed
    verification_hint: git diff --name-only
  - id: regression-tests
    statement: version regression tests pass
    verification_hint: pytest -q
grader:
  entrypoint: grader/run.py
  protocol: json_stdio
  timeout_seconds: 30
risk_class: elevated
