# Policy overrides for this task (SPEC §41.4 policy.yaml).
#
# Only `risk_class`, `budget`, `secrets`, and verification `nodes` are composed
# into the task contract (`forge_evals/runners/task_contract.py`); the harness
# rejects scope composition from this file outright. The earlier revision of
# this file declared `allowed_commands`, `allowed_read_paths`,
# `allowed_write_paths`, and `max_memory_mb`, none of which any runner reads —
# it stated a sandbox constraint that nothing enforced.
#
# Write scope for this task is enforced where it is actually checked: the
# `scope` acceptance criterion in task.yaml and the grader's `git status`
# inspection.
risk_class: normal
default_decision: allow_local
deny:
  - /etc/passwd
  - /etc/shadow
  - ~/.ssh
allow_network: []
require_approval_for:
  - side_effect.network
  - side_effect.external_state
