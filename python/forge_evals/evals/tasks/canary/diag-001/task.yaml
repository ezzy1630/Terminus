suite: canary
task: diag-001
cohort: canary
title: Read-only diagnosis of an off-by-one ledger bug
source_commit: fixture-canary-diag-001-v1
image_digest: local:python-3.12-pytest-8
timeout: 600
budget:
  max_cost_usd: 1.0
  max_wall_seconds: 600
  max_tool_calls: 50
  max_turns: 20
allowed_network: []
secrets: {}
grader_version: 1.0.0
rationale: >
  Canary archetype: read-only diagnosis. The agent must locate and explain a
  seeded bug without mutating any tracked file. The grader is deterministic:
  it checks the diagnosis content against the seeded root cause and verifies
  the workspace is unmodified.
acceptance_criteria:
  - id: diagnosis-file
    statement: DIAGNOSIS.md names the module, the function, and the root cause
    verification_hint: "file: DIAGNOSIS.md"
  - id: read-only
    statement: no tracked file is modified
    verification_hint: "command: git status --porcelain"
grader:
  entrypoint: grader/run.py
  protocol: json_stdio
  timeout_seconds: 30
risk_class: normal
