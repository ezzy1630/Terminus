# Statuses: open | accepted | fixed
# Residual accepted items require acceptance_rationale (SPEC §46.10 / §50.5).

schema_version: 1
updated: "2026-07-23"

findings:
  - id: FIND-001
    severity: high
    status: accepted
    owner: security-owner
    summary: External penetration test pending formal engagement for 0.1.0 preview.
    acceptance_rationale: >
      Accepted for 0.1.0 preview with compensating controls: kernel non-bypassability
      suite, policy default-deny, sandbox secure-local-default, secret brokerage,
      SBOM/cosign verification, and coordinated disclosure runbook. Formal external
      assessment is scheduled before 1.0; see docs/security/external-assessment.md.

  - id: FIND-002
    severity: medium
    status: accepted
    owner: release-owner
    summary: Full 24h soak requires a dedicated runner; CI runs a 30s smoke.
    acceptance_rationale: >
      Accepted for preview. CI executes scripts/soak-leak-test.sh with
      TERMINUS_SOAK_SECONDS=30 and growth gate TERMINUS_SOAK_MAX_GROWTH_PCT.
      Release owners MUST run TERMINUS_SOAK_SECONDS=86400 on a dedicated runner
      before promoting beyond preview (SPEC §46.16).

