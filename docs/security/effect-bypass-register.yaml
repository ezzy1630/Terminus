# Retired inherited-effect bypass register (ADR-0039, SPEC §27.5).
#
# This tombstone records that Terminus removed the inherited OpenCode source
# paths and no longer grants them a bootstrap exception. It does not assert
# that earlier parity snapshots or per-path `removed` declarations proved live
# behavior. Current first-party bypasses are release-blocking security defects.

version: 2
status: retired
retired_on: "2026-08-23"
owner: security-runtime
superseded_by: ADR-0039

active_entries: []

retirement_evidence:
  check: just standalone-check
  verifies:
    - retired bridge, source-pin, overlay, and fork-gate files are absent
    - first-party runtime imports and workspace dependencies do not reference OpenCode
    - runtime-protocol, public-api, and public-client ownership edges are explicit
  does_not_verify:
    - historical OpenCode behavior parity
    - historical execution of each retired bypass path
    - whole-system non-bypassability

current_policy:
  inherited_exception_allowed: false
  discovered_first_party_bypass: release_blocking
  required_action: fix the bypass or adopt a new security ADR before release
