# Effect bypass register (SPEC §27.5)
#
# Inventories direct effect paths in inherited OpenCode code that have not yet
# been routed through the Rust kernel. Each entry MUST list: id, owner, source,
# effect, reason, containment, removal_milestone, test, status.
#
# The release gate (SPEC §46.18) is NOT "zero entries immediately"; it is
# "no unknown entries, every entry contained, and all entries removed before
# the secure-default milestone (M4)."
#
# Status: open | contained | removed
#
# HONESTY NOTE (2026-07-12 audit): the previous version of this register listed
# six BYPASS entries pointing at packages/open-code-bridge/src/inherited/*.ts
# and tests/security/bypass/*.test.ts. None of those files existed — the OpenCode
# fork had not actually been imported (see upstream/opencode.lock.json, status
# `pending`). Those entries were removed because they documented bypasses in
# code that was not present and tests that did not exist. This register now
# reflects reality: zero inherited effect paths exist yet. When the OpenCode
# fork is imported (M1/M2), every inherited direct effect path MUST be added
# back here with a containment plan and a removal milestone BEFORE it ships.

