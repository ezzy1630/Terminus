# Terminus OpenCode divergence budget (SPEC §6.1, ADR-0002).
#
# Tracks modifications to inherited OpenCode files and merge-conflict hours.
# A maximum divergence budget per release is enforced at the release gate
# (SPEC §46.18). Generic fixes are proposed upstream.
#
# HONESTY NOTE (2026-07-12 audit): the previous version listed six
# modified_files entries pointing at packages/open-code-bridge/src/inherited/*.ts.
# Those files did not exist — the OpenCode fork had not been imported (see
# upstream/opencode.lock.json, status `pending`). The entries were removed
# because they tracked modifications to files that were not present. This
# budget now reflects reality: zero inherited files have been modified yet.
# When the OpenCode fork is imported, every Terminus-side modification to an
# inherited file MUST be recorded here with reason, owner, upstream PR,
# removal milestone, and conflict-hour estimate.

version: 1
last_updated: "2026-07-12"
owner: upstream-team

budget:
  per_release:
    max_modified_files: 25
    max_merge_conflict_hours: 8
    max_bypass_register_open: 0  # SPEC §27.5: no unknown entries; all contained
  review_cadence: per-release

modified_files: []

# Summary (auto-computed by tools/upstream-sync):
#   total_modified_files: 0
#   total_last_conflict_hours: 0
#   within_budget: true (0 <= 25, 0 <= 8)
#   bypass_register_open: 0

# Upstream PRs proposed by Terminus (generic fixes).
upstream_prs: []

# Sync log (most recent first).
sync_log:
  - date: "2026-07-12"
    action: "audit-correction"
    commit: "6601c2b36a6d8bc4a40cd75985f0dd0c802e7b0d"
    conflicts: 0
    notes: >
      Removed fabricated modified_files entries that referenced non-existent
      inherited/*.ts paths. No OpenCode fork has been imported yet; the
      divergence budget is zero until the fork is established (M1).
  - date: "2025-07-11"
    action: "initial-pin"
    commit: "0000000000000000000000000000000000000000"
    conflicts: 0
    notes: "Initial pin record (placeholder; real pin pending M1)."
