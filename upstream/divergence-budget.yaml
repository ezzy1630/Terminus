# Forge OpenCode divergence budget (SPEC §6.1, ADR-0002).
#
# Tracks modifications to inherited OpenCode files and merge-conflict hours.
# A maximum divergence budget per release is enforced at the release gate
# (SPEC §46.18). Generic fixes are proposed upstream.

version: 1
last_updated: "2025-07-11"
owner: upstream-team

# Per-release divergence budget. The release gate (SPEC §46.18) checks that
# the current divergence is within budget.
budget:
  per_release:
    max_modified_files: 25
    max_merge_conflict_hours: 8
    max_bypass_register_open: 0  # SPEC §27.5: no unknown entries; all contained
  review_cadence: per-release

# Modified inherited files. Each entry is a Forge-owned change to an inherited
# OpenCode file. Generic fixes are proposed upstream; Forge-side changes are
# temporary until the package is replaced behind a Forge interface (ADR-0002
# exit strategy).
