    reason: "Keep the event-id enrichment override compatible with the pinned TypeScript EventEmitter signature."
    owner: "upstream-team"
    upstream_pr: "pending-upstream-fix"
    removal_milestone: "next-upstream-sync"
    conflict_hours: 0.5

