# pnpm workspace manifest (SPEC §42.1, §43.2).
# Terminus-owned packages use pnpm workspaces. Bun is only used for the upstream
# OpenCode bridge (see ADR-0026). This manifest documents the workspace
# structure; the actual install is `bun install` against bun.lock during
# development.

packages:
  - "packages/*"
  - "apps/*"
  - "mini-services/terminus-control"
