# Buf code generation config (SPEC §45.4).
# Generates Rust types (prost) and TS clients (connect-es) from proto/.
# Run via `just codegen-proto` (which calls `buf generate proto`).

version: v2

managed:
  enabled: true
  override:
    - file_option: java_package_prefix
      value: dev.terminus
  # Disable Python codegen — the Python eval lab does not call the kernel RPC
  # directly; it consumes exported traces/artifacts.

plugins:
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    revision: 1
    out: crates/terminus-kernel-protocol/src/generated
  # Remote plugins are version-pinned (roadmap Phase 0): floating remote
  # plugins made `just codegen-check` drift without any repo change.
  # Bump pins in a dedicated toolchain PR together with regenerated files.
  - remote: buf.build/bufbuild/es:v2.14.0
    revision: 1
    out: packages/terminus-kernel-client/src/generated
    opt:
      - target=js+dts
      - import_extension=.js
  # Remote plugin is version-pinned (roadmap Phase 0): floating remote
  # plugins made `just codegen-check` drift without any repo change.
  # Bump this pin in a dedicated toolchain PR together with regenerated files.
  - remote: buf.build/community/stephenh-ts-proto:v2.12.0
    out: packages/terminus-kernel-client/src/generated-ts-proto
    opt:
      - esModuleInterop=true
      - outputJsonMethods=false
      - useOptionals=none
