name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Toolchain setup (shared) ----------
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      rust-cache-key: ${{ steps.rust-cache.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - run: just bootstrap

  # ---------- Lint + typecheck + codegen drift ----------
  lint-typecheck:
    name: Lint, typecheck, codegen drift
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: Format check (Rust + TS)
        run: |
          cargo fmt --all -- --check
          bun run lint
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: TypeScript typecheck
        run: bun run typecheck
      - name: Python lint (ruff + mypy)
        run: |
          cd python
          uv run ruff check .
          uv run mypy forge_evals
      - name: Codegen drift check
        run: just codegen-check

  # ---------- Build ----------
  build:
    name: Build (Rust + TS)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: Build Rust workspace
        run: cargo build --workspace --all-targets --locked
      - name: Build TypeScript workspace
        run: bun run build
      - name: Build Python package
        run: cd python && uv sync

  # ---------- Tests ----------
  unit-rust:
    name: Unit tests (Rust)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - run: cargo test --workspace --lib --locked

  unit-ts:
    name: Unit tests (TypeScript)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - run: bun run test:unit

  unit-python:
    name: Unit tests (Python eval)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - run: cd python && uv run pytest -q

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [unit-rust, unit-ts]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - run: cargo test --workspace --test '*' --locked
      - run: bun run test:integration || true

  # ---------- Security ----------
  security:
    name: Security scans
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: cargo deny (license + advisories + bans)
        run: cargo deny check
      - name: Bun audit
        run: bun audit --production || true
      - name: Python audit (pip-audit)
        run: cd python && uv run pip-audit --strict || true
      - name: Path traversal / secret redaction tests
        run: cargo test --workspace --test security
      - name: Architecture boundary checks
        run: |
          # Forbidden TS imports, direct provider SDK use, raw SQL outside
          # repositories/migrations, untyped event emission, direct secret
          # environment reads, checked-in generated-file drift (SPEC §42.5).
          echo "[boundary] TODO: run architecture-boundary checks"

  # ---------- Eval smoke (per PR for agent-behavior changes) ----------
  eval-smoke:
    name: Eval smoke
    runs-on: ubuntu-latest
    needs: integration
    if: ${{ contains(github.event.pull_request.labels.*.name, 'agent-behavior') }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - run: just eval-smoke

  # ---------- Upstream parity ----------
  upstream-check:
    name: Upstream OpenCode parity
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - run: just upstream-check

  # ---------- Buf breaking-change check ----------
  proto-breaking:
    name: Protobuf breaking-change check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: buf breaking (against main)
        run: buf breaking proto --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=proto" || true
