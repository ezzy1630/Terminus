name: CI

on:
  push:
    # Phase 0 truth fix: every branch that can hold the default or a
    # protected branch MUST run CI. Branches are listed explicitly;
    # scripts/check-declaration-consistency.ts fails when this list does not
    # cover the repository's actual default branch.
    branches: [main, dev, codex/release-blocker-closure]
  pull_request:
    branches: [main, dev, codex/release-blocker-closure]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Platform matrix (SPEC §46.13). Each platform builds and runs its relevant
# tests in the same VM so compiled output stays available to the test steps.
# Linux x86_64 runs the full platform slice; other platforms run curated tests.
# Flaky combinations are marked continue-on-error and fail-fast is disabled so
# every platform reports independently.
jobs:
  # ---------- Supported-host sandbox conformance (deep-audit blocker 0) ----------
  # Static unit tests prove argv shape; this job proves runtime containment
  # with real commands and adversarial fixtures on a supported host.
  sandbox-conformance:
    name: Sandbox conformance (linux + docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-terminus
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Linux sandbox unit tests (mount plan, minimal root, deny overlays)
        run: cargo test -p terminus-sandbox-linux --locked
      - name: Container backend unit tests (command shape)
        run: cargo test -p terminus-sandbox-container --locked
      - name: MicroVM fails closed without a guest protocol
        run: cargo test -p terminus-sandbox-microvm --locked
      - name: Live bwrap adversarial smoke (minimal root, no host-root bind)
        run: |
          set -eu
          # Host root must not be visible inside the namespace; the empty
          # root plus /usr bind means host homes are simply absent.
          bwrap --unshare-all \
            --ro-bind /usr /usr \
            --symlink usr/bin /bin \
            --proc /proc --dev /dev \
            --tmpfs /tmp --tmpfs /run \
            --clearenv --setenv PATH /usr/bin:/bin \
            --die-with-parent --new-session --cap-drop ALL \
            -- /bin/sh -c '
              test ! -e /root && echo "host-home-hidden"
              test ! -e /etc/shadow && echo "credentials-hidden"
              touch /probe 2>/dev/null && { echo "root-writable"; exit 13; } || echo "root-readonly"
              /usr/bin/unshare -Ur true 2>/dev/null && { echo "seccomp-gap"; exit 11; } || true
            ' | tee conformance.log
          grep -q host-home-hidden conformance.log
          grep -q credentials-hidden conformance.log
          grep -q root-readonly conformance.log
      - name: Live container conformance (fixed command shape, exact mounts)
        run: |
          set -eu
          IMAGE=$(docker pull alpine:latest >/dev/null 2>&1 && docker inspect --format '{{index .RepoDigests 0}}' alpine:latest)
          export TERMINUS_CONTAINER_CONFORMANCE_IMAGE="$IMAGE"
          cargo test -p terminus-sandbox-container --test live_conformance --locked

  # ---------- Architecture boundary checks (SPEC §42.5) ----------
  boundary-check:
    name: Architecture boundary checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-terminus
      - name: Run boundary checks (§42.5)
        run: just boundary-check

  # ---------- Lint + typecheck + codegen drift ----------
  lint-typecheck:
    name: Lint, typecheck, codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-terminus
      - name: Format check (Rust + TS)
        run: |
          cargo fmt --all -- --check
          bun run lint
      - name: Clippy (deny clippy::all per SPEC §44.2)
        run: cargo clippy --workspace --all-targets
      - name: Kernel mini-service lint + test (outside workspace)
        run: just kernel-mini-check
      - name: TypeScript typecheck (Terminus packages + dashboard)
        run: bun run typecheck:all
      - name: Python lint (ruff + mypy)
        run: |
          cd python
          uv run ruff check .
          uv run mypy forge_evals
      - name: Codegen drift check
        run: just codegen-check
      - name: Truth check (declaration consistency, roadmap Phase 0)
        run: just truth-check

  # ---------- Platform build + tests (§46.13) ----------
  platform:
    name: Platform (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            continue-on-error: false
            run-rust-tests: true
            run-ts-tests: true
          - os: ubuntu-24.04-arm
            label: linux-arm64
            target: aarch64-unknown-linux-gnu
            continue-on-error: true  # arm runners can be flaky
            run-rust-tests: true
            run-ts-tests: false
          - os: macos-latest
            label: macos-arm64
            target: aarch64-apple-darwin
            continue-on-error: false
            run-rust-tests: true
            run-ts-tests: true
          - os: macos-15-intel
            label: macos-x86_64
            target: x86_64-apple-darwin
            continue-on-error: true  # Intel macOS runners are scarce
            run-rust-tests: false
            run-ts-tests: false
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            continue-on-error: false
            run-rust-tests: true
            run-ts-tests: true
    continue-on-error: ${{ matrix.continue-on-error }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-terminus
      - name: Build Rust workspace (${{ matrix.target }})
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --workspace --all-targets --locked
      - name: Unit tests (Rust)
        if: ${{ matrix.run-rust-tests }}
        run: cargo test --workspace --lib --locked
      - name: Build TypeScript workspace
        run: bun run build
      - name: Unit tests (TypeScript)
        if: ${{ matrix.run-ts-tests }}
        run: bun run test:unit

  # Container profile build (SPEC §46.13) — compile inside a pinned Linux image.
  # Required gate: the image tag tracks the workspace rust-version pin
  # (rust-toolchain.toml), and failures here mean the container profile
  # silently stopped compiling if this job were allowed to fail.
  build-container:
    name: Build (linux-container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build workspace inside pinned rust container
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            rust:1.97-bookworm \
            bash -c 'source /usr/local/cargo/env && apt-get update -qq && apt-get install -y -qq protobuf-compiler && cargo build --workspace --all-targets --locked'


  unit-python:
    name: Unit tests (Python eval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-terminus
      - run: cd python && uv run pytest -q

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: platform
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-terminus
      - run: cargo test --workspace --test '*' --locked
      - run: bun run test:integration

  # ---------- Security ----------
  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-terminus
      - name: cargo deny (license + advisories + bans)
        run: cargo deny check
      - name: Bun audit
        run: bun audit --production
      - name: Python audit (pip-audit)
        run: cd python && uv run --extra dev pip-audit --skip-editable
      - name: Path traversal / secret redaction tests
        run: cargo test --workspace --test capability_token_e2e --test non_bypassability --test policy_wiring --test path_properties --test redaction_properties --test secret_canary_e2e
      - name: Phase 4 effective-control platform probes
        run: just platform-probes

  # ---------- Real public-path E2E ----------
  e2e:
    name: End-to-end public path
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-terminus
      - name: Run the supervised public API lifecycle and recovery path
        run: just e2e

  # ---------- M12 release-gate evidence (local subset) ----------
  m12-evidence:
    name: M12 release-gate evidence
    runs-on: ubuntu-latest
    needs: [integration, security, e2e]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-terminus
      - name: Produce M12 evidence bundle
        env:
          TERMINUS_SOAK_SECONDS: "30"
          # M12 is the documented local evidence subset (R9): fixture eval
          # evidence and zero-valued ops metrics no longer masquerade as
          # passing gate checks here — they surface as explicit
          # pending_live_* states in the bundle. The signed release decision
          # path still rejects both unconditionally.
          # These are explicit M12 local-subset fallbacks. Stable release
          # validation intentionally leaves both disabled.
          TERMINUS_RELEASE_ALLOW_PLACEHOLDER_METRICS: "1"
          TERMINUS_RELEASE_ALLOW_SBOM_FALLBACK: "1"
        run: |
          export TERMINUS_RELEASE_COMMIT="${GITHUB_SHA}"
          export TERMINUS_RELEASE_VERSION="$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          export TERMINUS_RELEASE_RUN_STARTED_AT="$(date -u +%s)"
          just release-evidence-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m12-release-gate-evidence
          path: artifacts/release-gate/

  # ---------- Eval smoke (agent-behavior cohort) ----------
  # R8/R9: fixture smoke runs on every PR so regressions in the eval lab
  # itself are caught without requiring a label. It is explicitly fixture
  # tier and never counts as release evidence (see live-eval below).
  eval-smoke:
    name: Eval smoke (fixture tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-terminus
      - run: just eval-smoke

  # ---------- Live evaluation (dispatch-only; R8) ----------
  # Runs the real Terminus coding loop against a small internal cohort with
  # a real provider key. Never triggered by pull_request events, so PR CI
  # stays green without secrets; results land as workflow artifacts and feed
  # the cache-telemetry release gate when run.
  live-eval:
    name: Live evaluation cohort
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == github.event.repository.full_name }}
    concurrency:
      group: live-eval-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-terminus
      - name: Start kernel + control plane
        run: bash scripts/start-mini-services.sh &
        env:
          TERMINUS_CONTROL_TOKEN: terminus-live-eval-token
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Wait for control plane
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3050/healthz >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "control plane did not become healthy" >&2
          exit 1
      - name: Run live cohort (forge-internal)
        env:
          TERMINUS_CONTROL_URL: http://127.0.0.1:3050
          TERMINUS_CONTROL_TOKEN: terminus-live-eval-token
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd python
          uv run terminus-eval run \
            --suite terminus-internal \
            --task build-failure/build-001 \
            --task-dir "forge_evals/evals/tasks/build-failure/build-001" \
            --harness terminus-live \
            --seeds 1 --output-dir evals/results/live
      - name: Collect cache telemetry evidence
        if: always()
        env:
          TERMINUS_CACHE_TELEMETRY_DB: ${{ github.workspace }}/.terminus-data/control.db
        run: bun run scripts/collect-cache-telemetry.ts || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-eval-results
          path: |
            python/evals/results/live/
            artifacts/release-gate/cache-telemetry.json

  # ---------- Standalone architecture ----------
  standalone-check:
    name: Standalone runtime ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-terminus
      - run: just standalone-check

  # ---------- Buf breaking-change check ----------
  proto-breaking:
    name: Protobuf breaking-change check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-terminus
      # Compare against the local origin/main ref. fetch-depth: 0 guarantees
      # the ref exists without requiring a separate authenticated clone.
      - name: buf breaking (against main)
        run: buf breaking proto --against ".git#branch=origin/main,subdir=proto"
