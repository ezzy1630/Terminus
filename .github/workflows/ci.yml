name: CI

on:
  push:
    # Phase 0 truth fix: every branch that can hold the default or a
    # protected branch MUST run CI. Branches are listed explicitly;
    # scripts/check-declaration-consistency.ts fails when this list does not
    # cover the repository's actual default branch.
    branches: [main, dev, codex/release-blocker-closure]
  pull_request:
    branches: [main, dev, codex/release-blocker-closure]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Platform matrix (SPEC §46.13). The full test suite runs on Linux x86_64;
# other platforms run build + a curated subset of tests. Flaky combinations
# are marked continue-on-error so a single platform regression does not
# block the whole pipeline. fail-fast is disabled so every platform
# reports independently.
jobs:
  # ---------- Toolchain setup (shared) ----------
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      rust-cache-key: ${{ steps.rust-cache.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - run: just bootstrap

  # ---------- Architecture boundary checks (SPEC §42.5) ----------
  boundary-check:
    name: Architecture boundary checks
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: Run boundary checks (§42.5)
        run: just boundary-check

  # ---------- Lint + typecheck + codegen drift ----------
  lint-typecheck:
    name: Lint, typecheck, codegen drift
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: Format check (Rust + TS)
        run: |
          cargo fmt --all -- --check
          bun run lint
      - name: Clippy (deny clippy::all per SPEC §44.2)
        run: cargo clippy --workspace --all-targets
      - name: Kernel mini-service lint + test (outside workspace)
        run: just kernel-mini-check
      - name: TypeScript typecheck (Terminus packages + dashboard)
        run: bun run typecheck:all
      - name: Python lint (ruff + mypy)
        run: |
          cd python
          uv run ruff check .
          uv run mypy forge_evals
      - name: Codegen drift check
        run: just codegen-check
      - name: Truth check (declaration consistency, roadmap Phase 0)
        run: just truth-check

  # ---------- Build matrix (§46.13) ----------
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            continue-on-error: false
          - os: ubuntu-24.04-arm
            label: linux-arm64
            target: aarch64-unknown-linux-gnu
            continue-on-error: true  # arm runners can be flaky
          - os: macos-latest
            label: macos-arm64
            target: aarch64-apple-darwin
            continue-on-error: false
          - os: macos-15-intel
            label: macos-x86_64
            target: x86_64-apple-darwin
            continue-on-error: true  # Intel macOS runners are scarce
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            continue-on-error: false
    continue-on-error: ${{ matrix.continue-on-error }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: Build Rust workspace (${{ matrix.target }})
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --workspace --all-targets --locked
      - name: Build TypeScript workspace
        run: bun run build
      - name: Build Python package
        run: cd python && uv sync

  # Container profile build (SPEC §46.13) — compile inside a pinned Linux image.
  build-container:
    name: Build (linux-container)
    runs-on: ubuntu-latest
    needs: setup
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build workspace inside rust:bookworm container
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            rust:bookworm \
            bash -c 'source /usr/local/cargo/env && apt-get update -qq && apt-get install -y -qq protobuf-compiler && cargo build --workspace --all-targets --locked'


  # ---------- Tests (Linux x86_64 = full) ----------
  unit-rust:
    name: Unit tests (Rust, ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            continue-on-error: false
          - os: ubuntu-24.04-arm
            label: linux-arm64
            continue-on-error: true
          - os: macos-latest
            label: macos-arm64
            continue-on-error: false
          - os: windows-latest
            label: windows-x86_64
            continue-on-error: false
    continue-on-error: ${{ matrix.continue-on-error }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - run: cargo test --workspace --lib --locked

  unit-ts:
    name: Unit tests (TypeScript, ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            continue-on-error: false
          - os: macos-latest
            label: macos-arm64
            continue-on-error: false
          - os: windows-latest
            label: windows-x86_64
            continue-on-error: false
    continue-on-error: ${{ matrix.continue-on-error }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - run: bun run test:unit

  unit-python:
    name: Unit tests (Python eval)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - run: cd python && uv run pytest -q

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [unit-rust, unit-ts]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - run: cargo test --workspace --test '*' --locked
      - run: bun run test:integration

  # ---------- Security ----------
  security:
    name: Security scans
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: cargo deny (license + advisories + bans)
        run: cargo deny check
      - name: Bun audit
        run: bun audit --production
      - name: Python audit (pip-audit)
        run: cd python && uv run --extra dev pip-audit --skip-editable
      - name: Path traversal / secret redaction tests
        run: cargo test --workspace --test capability_token_e2e --test non_bypassability --test policy_wiring --test path_properties --test redaction_properties --test secret_canary_e2e
      - name: Phase 4 effective-control platform probes
        run: just platform-probes

  # ---------- Real public-path E2E ----------
  e2e:
    name: End-to-end public path
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: Run the supervised public API lifecycle and recovery path
        run: just e2e

  # ---------- Linux enforcement host gate ----------
  # Both enforcement jobs require delegated host controls (writable cgroup
  # hierarchy + unprivileged user namespaces for bubblewrap). GitHub-hosted
  # Ubuntu runners deny both, so they can only report their environment as
  # Degraded here. They stay visible but non-blocking; the AUTHORITATIVE
  # evidence path is the dedicated Linux runner (linux-evidence.yml +
  # TERMINUS_LINUX_EVIDENCE), and release-check still fails closed when that
  # signed evidence is absent (SPEC §46.18).
  linux-enforcement-preflight:
    name: Linux enforcement prerequisites
    runs-on: ubuntu-latest
    needs: setup
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: Install host enforcement dependencies
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap jq
      - name: Verify delegated Linux controls
        run: just linux-enforcement-prereqs

  # ---------- Linux adversarial enforcement ----------
  linux-enforcement-adversarial:
    name: Linux adversarial sandbox enforcement
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: Install host enforcement dependencies
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap jq python3
      - name: Build kernel probe binary
        run: cargo build --release --manifest-path mini-services/terminus-kernel/Cargo.toml
      - name: Verify effective enforcement
        env:
          TERMINUS_ENFORCEMENT_REPORT: ${{ runner.temp }}/terminus-enforcement-report.json
          TERMINUS_KERNEL_BINARY: ${{ github.workspace }}/mini-services/terminus-kernel/target/release/terminus-kernel-mini
        run: bash scripts/run-linux-enforcement-probe.sh
      - name: Upload enforcement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-enforcement-report
          path: ${{ runner.temp }}/terminus-enforcement-report.json
          if-no-files-found: error

  # ---------- M12 release-gate evidence (local subset) ----------
  m12-evidence:
    name: M12 release-gate evidence
    runs-on: ubuntu-latest
    needs: [integration, security, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: Produce M12 evidence bundle
        env:
          TERMINUS_SOAK_SECONDS: "30"
          TERMINUS_RELEASE_OWNER_APPROVAL: "ci-release-owner"
          TERMINUS_SECURITY_OWNER_APPROVAL: "ci-security-owner"
          TERMINUS_PROTOCOL_OWNER_APPROVAL: "ci-protocol-owner"
          TERMINUS_EVALUATION_OWNER_APPROVAL: "ci-evaluation-owner"
        run: |
          export TERMINUS_RELEASE_COMMIT="${GITHUB_SHA}"
          export TERMINUS_RELEASE_RUN_STARTED_AT="$(date -u +%s)"
          just fuzz-smoke
          just fault-injection
          just release-drills
          just soak
          just canary
          just eval-release
          just eval-baseline
          just sbom-verify
          just schema-freeze-evidence
          just release-decision
          just system-card
          bun run scripts/m12-exit-gate.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-release-gate-evidence
          path: artifacts/release-gate/

  # ---------- Eval smoke (agent-behavior cohort) ----------
  eval-smoke:
    name: Eval smoke
    runs-on: ubuntu-latest
    needs: integration
    if: ${{ contains(github.event.pull_request.labels.*.name, 'agent-behavior') }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - run: just eval-smoke

  # ---------- Upstream parity ----------
  upstream-check:
    name: Upstream OpenCode parity
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - run: just upstream-check

  # ---------- Buf breaking-change check ----------
  proto-breaking:
    name: Protobuf breaking-change check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      # Compare against the local origin/main ref: the repository is private,
      # so buf's remote-clone template cannot authenticate without extra
      # credentials. fetch-depth: 0 guarantees the ref exists.
      - name: buf breaking (against main)
        run: buf breaking proto --against ".git#branch=origin/main,subdir=proto"
