name: Linux enforcement evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Produce signed Linux enforcement evidence
    runs-on: [self-hosted, linux, x64, terminus-enforcement]
    env:
      # The runner administrator delegates this subtree to the Actions user.
      # The workflow verifies it but never mutates the host cgroup hierarchy.
      TERMINUS_CGROUP_ROOT: /sys/fs/cgroup/terminus-ci
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-terminus
      - name: Resolve release identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version // empty' package.json)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "package.json version must be stable SemVer: $version" >&2
            exit 1
          }
          printf 'TERMINUS_RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'TERMINUS_RELEASE_COMMIT=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Verify dedicated-runner enforcement prerequisites
        run: just linux-enforcement-prereqs
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
      - name: Build kernel probe binary
        run: cargo build --release --manifest-path mini-services/terminus-kernel/Cargo.toml
      - name: Produce signed evidence
        env:
          TERMINUS_RELEASE_COMMIT: ${{ github.sha }}
          TERMINUS_KERNEL_BINARY: ${{ github.workspace }}/mini-services/terminus-kernel/target/release/terminus-kernel-mini
          TERMINUS_ENFORCEMENT_REPORT: ${{ runner.temp }}/terminus-enforcement-report.json
          TERMINUS_LINUX_EVIDENCE: ${{ runner.temp }}/terminus-linux-evidence.json
          TERMINUS_LINUX_EVIDENCE_SIGNATURE: ${{ runner.temp }}/terminus-linux-evidence.json.sig
          TERMINUS_LINUX_EVIDENCE_CERTIFICATE: ${{ runner.temp }}/terminus-linux-evidence.json.pem
          TERMINUS_LINUX_TEST_LOG: ${{ runner.temp }}/terminus-linux-enforcement.log
          TERMINUS_LINUX_TEST_COMMAND: bash scripts/run-linux-enforcement-probe.sh
        run: just linux-enforcement-evidence
      - name: Verify signed evidence
        env:
          TERMINUS_RELEASE_COMMIT: ${{ github.sha }}
          TERMINUS_LINUX_EVIDENCE: ${{ runner.temp }}/terminus-linux-evidence.json
          TERMINUS_LINUX_EVIDENCE_SIGNATURE: ${{ runner.temp }}/terminus-linux-evidence.json.sig
          TERMINUS_LINUX_EVIDENCE_CERTIFICATE: ${{ runner.temp }}/terminus-linux-evidence.json.pem
        run: bash scripts/verify-release-evidence.sh
      - name: Verify evidence release identity
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EVIDENCE: ${{ runner.temp }}/terminus-linux-evidence.json
        run: |
          set -euo pipefail
          expected_version="${TERMINUS_RELEASE_VERSION:?TERMINUS_RELEASE_VERSION is required}"
          jq -e --arg commit "$EXPECTED_COMMIT" --arg version "$expected_version" '
            (.candidate_commit | type == "string" and length > 0) and
            (.terminus_commit | type == "string" and . == $commit) and
            (.candidate_commit == $commit) and
            (.release_version | type == "string" and . == $version)
          ' "$EVIDENCE" >/dev/null
      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-enforcement-evidence
          path: |
            ${{ runner.temp }}/terminus-linux-evidence.json
            ${{ runner.temp }}/terminus-linux-evidence.json.sig
            ${{ runner.temp }}/terminus-linux-evidence.json.pem
            ${{ runner.temp }}/terminus-linux-enforcement.log
            ${{ runner.temp }}/terminus-enforcement-report.json
          if-no-files-found: error
