name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  # ---------- Supply-chain gate (SPEC §46.14) ----------
  supply-chain-gate:
    name: Supply-chain gate (cargo deny + bun audit + pip-audit)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: cargo deny (licenses, advisories, bans, sources)
        run: cargo deny check
      - name: bun audit (npm advisories)
        run: bun audit --production
      - name: pip-audit (Python advisories)
        run: cd python && uv export --frozen --extra dev --no-emit-project | uv run pip-audit --strict -r /dev/stdin
      - name: Boundary checks (§42.5)
        run: just boundary-check
      - name: Codegen drift (§45.2)
        run: just codegen-check
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            raw_version="$INPUT_VERSION"
          else
            raw_version="${GITHUB_REF_NAME}"
          fi
          echo "version=${raw_version#v}" >> "$GITHUB_OUTPUT"

  # ---------- Build signed artifacts across platforms ----------
  build-artifacts:
    name: Build signed artifacts (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: supply-chain-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: terminus-kernel-linux-amd64
            binary: terminus-kernel-mini
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: terminus-kernel-linux-arm64
            binary: terminus-kernel-mini
            linker: aarch64-linux-gnu-gcc
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: terminus-kernel-darwin-arm64
            binary: terminus-kernel-mini
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: terminus-kernel-windows-amd64.exe
            binary: terminus-kernel-mini.exe
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install Linux cross-linker
        if: matrix.linker != ''
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Build kernel binary (release)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --target ${{ matrix.target }} --manifest-path mini-services/terminus-kernel/Cargo.toml
      - name: Build control plane distribution
        run: bun run build
      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp mini-services/terminus-kernel/target/${{ matrix.target }}/release/${{ matrix.binary }} dist/${{ matrix.artifact }}
      - name: Generate portable checksums
        shell: bash
        run: node -e "const fs = require('node:fs'); const crypto = require('node:crypto'); const name = process.argv[1]; const digest = crypto.createHash('sha256').update(fs.readFileSync('dist/' + name)).digest('hex'); fs.writeFileSync('dist/' + name + '.sha256', digest + '  ' + name + '\\n');" "${{ matrix.artifact }}"
      - name: Generate SBOM (syft, SPDX-JSON)
        uses: anchore/sbom-action@v0
        with:
          artifact-name: ${{ matrix.artifact }}.sbom.spdx.json
          format: spdx-json
          output-file: dist/${{ matrix.artifact }}.sbom.spdx.json
      - name: Sign artifact (cosign)
        uses: sigstore/cosign-installer@v3
      - shell: bash
        run: |
          cosign sign-blob --yes dist/${{ matrix.artifact }} \
            --output-signature dist/${{ matrix.artifact }}.sig \
            --output-certificate dist/${{ matrix.artifact }}.pem
      - name: Attest build provenance (§46.15)
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  # ---------- Signed Linux enforcement evidence ----------
  linux-enforcement-evidence:
    name: Signed Linux enforcement evidence
    runs-on: ubuntu-latest
    needs: supply-chain-gate
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: Install host enforcement dependencies
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap jq python3
      - name: Delegate cgroup-v2 subtree to the kernel probe
        run: |
          sudo install -d -m 0755 /sys/fs/cgroup/terminus-ci
          printf '+cpu +memory +pids\n' | sudo tee /sys/fs/cgroup/terminus-ci/cgroup.subtree_control
      - name: Verify Bubblewrap namespace support
        run: |
          sudo bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev \
            --die-with-parent --new-session --cap-drop ALL -- /bin/true
      - name: Verify delegated cgroup lease controls
        run: |
          sudo bash -ec '
            parent=/sys/fs/cgroup/terminus-ci/.terminus-control-parent
            lease="$parent/job"
            mkdir "$parent"
            printf "%s\\n" "+cpu +memory +pids" > "$parent/cgroup.subtree_control"
            mkdir "$lease"
            printf "%s\\n" 32 > "$lease/pids.max"
            printf "%s\\n" "$$" > "$lease/cgroup.procs"
          '
          sudo rmdir /sys/fs/cgroup/terminus-ci/.terminus-control-parent/job
          sudo rmdir /sys/fs/cgroup/terminus-ci/.terminus-control-parent
      - uses: sigstore/cosign-installer@v3
      - name: Build kernel probe binary
        run: |
          cargo build --release --manifest-path mini-services/terminus-kernel/Cargo.toml
          sudo install -D -m 0755 \
            mini-services/terminus-kernel/target/release/terminus-kernel-mini \
            /usr/local/lib/terminus/terminus-kernel-mini
      - name: Produce signed evidence
        env:
          TERMINUS_RELEASE_COMMIT: ${{ github.sha }}
          TERMINUS_CGROUP_ROOT: /sys/fs/cgroup/terminus-ci
          TERMINUS_KERNEL_BINARY: /usr/local/lib/terminus/terminus-kernel-mini
          TERMINUS_ENFORCEMENT_REPORT: ${{ runner.temp }}/terminus-enforcement-report.json
          TERMINUS_LINUX_EVIDENCE: ${{ runner.temp }}/terminus-linux-evidence.json
          TERMINUS_LINUX_EVIDENCE_SIGNATURE: ${{ runner.temp }}/terminus-linux-evidence.json.sig
          TERMINUS_LINUX_EVIDENCE_CERTIFICATE: ${{ runner.temp }}/terminus-linux-evidence.json.pem
          TERMINUS_LINUX_TEST_LOG: ${{ runner.temp }}/terminus-linux-enforcement.log
          TERMINUS_LINUX_TEST_COMMAND: sudo --preserve-env=TERMINUS_CGROUP_ROOT,TERMINUS_ENFORCEMENT_REPORT,TERMINUS_KERNEL_BINARY bash scripts/run-linux-enforcement-probe.sh
        run: just linux-enforcement-evidence
      - name: Verify signed evidence
        env:
          TERMINUS_RELEASE_COMMIT: ${{ github.sha }}
          TERMINUS_LINUX_EVIDENCE: ${{ runner.temp }}/terminus-linux-evidence.json
          TERMINUS_LINUX_EVIDENCE_SIGNATURE: ${{ runner.temp }}/terminus-linux-evidence.json.sig
          TERMINUS_LINUX_EVIDENCE_CERTIFICATE: ${{ runner.temp }}/terminus-linux-evidence.json.pem
        run: bash scripts/verify-release-evidence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-enforcement-evidence
          path: |
            ${{ runner.temp }}/terminus-linux-evidence.json
            ${{ runner.temp }}/terminus-linux-evidence.json.sig
            ${{ runner.temp }}/terminus-linux-evidence.json.pem
            ${{ runner.temp }}/terminus-linux-enforcement.log
            ${{ runner.temp }}/terminus-enforcement-report.json
          if-no-files-found: error

  # ---------- Aggregate + publish release ----------
  publish-release:
    name: Publish release with SBOM and provenance
    runs-on: ubuntu-latest
    needs: [supply-chain-gate, build-artifacts, linux-enforcement-evidence]
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    environment: terminus-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - name: Require recorded release approvals
        env:
          RELEASE_OWNER_APPROVAL: ${{ vars.TERMINUS_RELEASE_OWNER_APPROVAL }}
          SECURITY_OWNER_APPROVAL: ${{ vars.TERMINUS_SECURITY_OWNER_APPROVAL }}
          PROTOCOL_OWNER_APPROVAL: ${{ vars.TERMINUS_PROTOCOL_OWNER_APPROVAL }}
          EVALUATION_OWNER_APPROVAL: ${{ vars.TERMINUS_EVALUATION_OWNER_APPROVAL }}
        run: |
          for approval in RELEASE_OWNER_APPROVAL SECURITY_OWNER_APPROVAL PROTOCOL_OWNER_APPROVAL EVALUATION_OWNER_APPROVAL; do
            test -n "${!approval}" || { echo "missing recorded approval: $approval" >&2; exit 1; }
          done
      - name: Verify Linux enforcement evidence before publishing
        env:
          TERMINUS_RELEASE_COMMIT: ${{ github.sha }}
          TERMINUS_LINUX_EVIDENCE: dist/terminus-linux-evidence.json
          TERMINUS_LINUX_EVIDENCE_SIGNATURE: dist/terminus-linux-evidence.json.sig
          TERMINUS_LINUX_EVIDENCE_CERTIFICATE: dist/terminus-linux-evidence.json.pem
        run: bash scripts/verify-release-evidence.sh
      - name: Aggregate SBOMs and signatures
        run: |
          mkdir -p release
          cp dist/*.sbom.spdx.json release/
          cp dist/*.sha256 release/
          cp dist/*.sig release/
          cp dist/*.pem release/
          cp dist/terminus-linux-evidence.json* release/
          cp dist/terminus-linux-enforcement.log release/
          cp dist/terminus-enforcement-report.json release/
          cp dist/terminus-kernel-* release/
      - name: Publish migration bundle
        run: |
          tar -czf release/migrations.tar.gz migrations/
      - name: Publish generated clients and schemas
        run: |
          tar -czf release/generated-clients.tar.gz packages/terminus-kernel-client/src/generated
          tar -czf release/schemas.tar.gz schemas/
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          tag_name: v${{ needs.supply-chain-gate.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true

  release-decision:
    name: Machine-readable release decision (SPEC §50.10)
    runs-on: ubuntu-latest
    needs: [publish-release, supply-chain-gate]
    steps:
      - uses: actions/checkout@v4
      - name: Write release decision
        env:
          RELEASE_OWNER_APPROVAL: ${{ vars.TERMINUS_RELEASE_OWNER_APPROVAL }}
          SECURITY_OWNER_APPROVAL: ${{ vars.TERMINUS_SECURITY_OWNER_APPROVAL }}
          PROTOCOL_OWNER_APPROVAL: ${{ vars.TERMINUS_PROTOCOL_OWNER_APPROVAL }}
          EVALUATION_OWNER_APPROVAL: ${{ vars.TERMINUS_EVALUATION_OWNER_APPROVAL }}
        run: |
          cat > release-decision.yaml <<EOF
          release:
            version: v${{ needs.supply-chain-gate.outputs.version }}
            commit: ${{ github.sha }}
            protocol_versions:
              terminus_kernel_v1: "1"
            database_schema_version: 1
            supported_platforms:
              - linux-x86_64
              - linux-arm64
              - linux-container
              - macos-arm64
              - macos-x86_64
              - windows-x86_64
            security_profile: secure-local-default
            evaluation_report: artifacts/release-gate/eval-release.json
            divergence_report: upstream/divergence-budget.yaml
            known_limitations: []
            accepted_risks:
              - FIND-001
              - FIND-002
            signatures:
              release_owner: "${RELEASE_OWNER_APPROVAL}"
              security_owner: "${SECURITY_OWNER_APPROVAL}"
              protocol_owner: "${PROTOCOL_OWNER_APPROVAL}"
              evaluation_owner: "${EVALUATION_OWNER_APPROVAL}"
          EOF
          # Also stage under artifacts/release-gate for local gate parity.
          mkdir -p artifacts/release-gate
          cp release-decision.yaml artifacts/release-gate/release-decision.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: release-decision
          path: release-decision.yaml
