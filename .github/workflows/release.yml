name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  # ---------- Supply-chain gate (SPEC §46.14) ----------
  supply-chain-gate:
    name: Supply-chain gate (cargo deny + bun audit + pip-audit)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: cargo deny (licenses, advisories, bans, sources)
        run: cargo deny check
      - name: bun audit (npm advisories)
        run: bun audit --production
      - name: pip-audit (Python advisories)
        run: cd python && uv run pip-audit --strict
      - name: Boundary checks (§42.5)
        run: just boundary-check
      - name: Codegen drift (§45.2)
        run: just codegen-check
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  # ---------- Build signed artifacts across platforms ----------
  build-artifacts:
    name: Build signed artifacts (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: supply-chain-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: forge-kernel-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: forge-kernel-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: forge-kernel-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: forge-kernel-windows-amd64.exe
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: Build kernel binary (release)
        run: cargo build --release --target ${{ matrix.target }} -p forge-kernel-mini
      - name: Build control plane distribution
        run: bun run build
      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/forge-kernel-mini dist/${{ matrix.artifact }} || true
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
      - name: Generate SBOM (syft, SPDX-JSON)
        uses: anchore/sbom-action@v0
        with:
          artifact-name: ${{ matrix.artifact }}.sbom.spdx.json
          format: spdx-json
          output-file: dist/${{ matrix.artifact }}.sbom.spdx.json
      - name: Sign artifact (cosign)
        uses: sigstore/cosign-installer@v3
      - shell: bash
        run: |
          cosign sign-blob --yes dist/${{ matrix.artifact }} \
            --output-signature dist/${{ matrix.artifact }}.sig \
            --output-certificate dist/${{ matrix.artifact }}.pem
      - name: Attest build provenance (§46.15)
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-name: ${{ matrix.artifact }}
          subject-digest: sha256:$(sha256sum dist/${{ matrix.artifact }} | awk '{print $1}')
          push-to-registry: false
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  # ---------- Container image build + scan (§46.14, §46.15) ----------
  # Forge does not currently ship a container image as a release artifact.
  # This job is a documented placeholder: when a container image is added
  # (e.g. via `crates/forge-sandbox-container` or a control-plane image),
  # uncomment the build step and wire `grype`/`trivy` scanning in. The
  # SBOM step still runs so the supply-chain posture is recorded.
  container-scan:
    name: Container image + SBOM + scan
    runs-on: ubuntu-latest
    needs: supply-chain-gate
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just bootstrap
      - name: Build container image (placeholder)
        run: |
          echo "[container-scan] No container image is currently built as a"
          echo "[container-scan] release artifact. When one is added, build it here"
          echo "[container-scan] (e.g. docker build -t forge:${{ needs.supply-chain-gate.outputs.version }} .)"
          echo "[container-scan] and run grype/trivy against the image digest."
      - name: Generate repo-level SBOM (syft, CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          artifact-name: forge-repo.cdx.json
          format: cyclonedx-json
          output-file: dist/forge-repo.cdx.json
      - name: Scan SBOM for vulnerabilities (grype)
        uses: anchore/scan-action@v4
        continue-on-error: true
        with:
          sbom: dist/forge-repo.cdx.json
          fail-build: false
          output-format: sarif
      - uses: actions/upload-artifact@v4
        with:
          name: container-sbom
          path: dist/*

  # ---------- Aggregate + publish release ----------
  publish-release:
    name: Publish release with SBOM and provenance
    runs-on: ubuntu-latest
    needs: [build-artifacts, container-scan]
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Aggregate SBOMs and signatures
        run: |
          mkdir -p release
          cp dist/*.sbom.spdx.json release/ || true
          cp dist/*.cdx.json release/ || true
          cp dist/*.sha256 release/ || true
          cp dist/*.sig release/ || true
          cp dist/*.pem release/ || true
          cp dist/forge-kernel-* release/ || true
      - name: Generate aggregate provenance (SLSA)
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
        with:
          base64-subjects: ""
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
      - name: Publish migration bundle
        run: |
          tar -czf release/migrations.tar.gz migrations/
      - name: Publish generated clients and schemas
        run: |
          tar -czf release/generated-clients.tar.gz packages/forge-kernel-client/src/generated || true
          tar -czf release/schemas.tar.gz schemas/

  release-decision:
    name: Machine-readable release decision (SPEC §50.10)
    runs-on: ubuntu-latest
    needs: publish-release
    steps:
      - uses: actions/checkout@v4
      - name: Write release decision
        run: |
          cat > release-decision.yaml <<'EOF'
          release:
            version: ${{ github.event.inputs.version || github.ref_name }}
            commit: ${{ github.sha }}
            protocol_versions:
              forge_kernel_v1: "1"
            database_schema_version: 1
            supported_platforms: []
            security_profile: secure-local-default
            evaluation_report: docs/research/sources.md
            divergence_report: upstream/divergence-budget.yaml
            known_limitations: []
            accepted_risks: []
            signatures:
              release_owner: ""
              security_owner: ""
              protocol_owner: ""
              evaluation_owner: ""
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: release-decision
          path: release-decision.yaml
