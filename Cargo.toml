[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"
# `unwrap_used`/`expect_used`/`panic` are members of the `pedantic` group;
# giving them a higher priority than the group avoids clippy's "lint group
# has the same priority as a lint" config error while preserving the SPEC
# §44.2 intent (these three are denied even though pedantic is advisory).
unwrap_used = { level = "deny", priority = 1 }
expect_used = { level = "deny", priority = 1 }
panic = { level = "deny", priority = 1 }

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
tempfile = "3"
anyhow = "1"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
terminus-kernel-protocol = { path = "crates/terminus-kernel-protocol" }
terminus-fs = { path = "crates/terminus-fs" }
terminus-artifacts = { path = "crates/terminus-artifacts" }
terminus-policy = { path = "crates/terminus-policy" }
terminus-sandbox = { path = "crates/terminus-sandbox" }
terminus-sandbox-linux = { path = "crates/terminus-sandbox-linux" }
terminus-sandbox-macos = { path = "crates/terminus-sandbox-macos" }
terminus-sandbox-windows = { path = "crates/terminus-sandbox-windows" }
terminus-sandbox-container = { path = "crates/terminus-sandbox-container" }
terminus-process = { path = "crates/terminus-process" }
terminus-jobs = { path = "crates/terminus-jobs" }
terminus-patch = { path = "crates/terminus-patch" }
terminus-secrets = { path = "crates/terminus-secrets" }
terminus-egress = { path = "crates/terminus-egress" }
terminus-code-intel = { path = "crates/terminus-code-intel" }
terminus-extension-runtime = { path = "crates/terminus-extension-runtime" }
terminus-git = { path = "crates/terminus-git" }
terminus-authz = { path = "crates/terminus-authz" }
terminus-kernel = { path = "crates/terminus-kernel" }
terminus-kernel-testkit = { path = "crates/terminus-kernel-testkit" }
