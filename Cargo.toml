[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
tempfile = "3"
anyhow = "1"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
forge-kernel-protocol = { path = "crates/forge-kernel-protocol" }
forge-fs = { path = "crates/forge-fs" }
forge-artifacts = { path = "crates/forge-artifacts" }
forge-policy = { path = "crates/forge-policy" }
forge-sandbox = { path = "crates/forge-sandbox" }
forge-sandbox-linux = { path = "crates/forge-sandbox-linux" }
forge-sandbox-macos = { path = "crates/forge-sandbox-macos" }
forge-sandbox-windows = { path = "crates/forge-sandbox-windows" }
forge-sandbox-container = { path = "crates/forge-sandbox-container" }
forge-process = { path = "crates/forge-process" }
forge-jobs = { path = "crates/forge-jobs" }
forge-patch = { path = "crates/forge-patch" }
forge-secrets = { path = "crates/forge-secrets" }
forge-egress = { path = "crates/forge-egress" }
forge-code-intel = { path = "crates/forge-code-intel" }
forge-extension-runtime = { path = "crates/forge-extension-runtime" }
forge-git = { path = "crates/forge-git" }
forge-authz = { path = "crates/forge-authz" }
forge-kernel = { path = "crates/forge-kernel" }
forge-kernel-testkit = { path = "crates/forge-kernel-testkit" }
